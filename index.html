Bahnsteig 3. Eine junge Frau hält ein Schild hoch: „Cześć! To ty?“ Es ist Ania. Szymek winkt dir zu und verschwindet zwischen den anderen Krasnalen der Stadt. Du hast den ganzen Brief allein gelesen, auf Polnisch.","Wrocław Główny, platform 3. A young woman holds up a sign: \"Cześć! To ty?\" (\"Hi! Is that you?\") It's Ania. Szymek waves at you and disappears among the city's other Krasnale. You read the whole letter by yourself, in Polish."],"lines":[{"u":"waw","pl":"Dzień dobry! Dziękuję, że czytasz ten list.","tr":["Guten Tag! Danke, dass du diesen Brief liest.","Good day! Thank you for reading this letter."],"bridge":["Szymek klopft auf den Umschlag: „Die erste Zeile kannst du schon lesen! Wer da schreibt, erfährst du in Łódź.“","Szymek taps the envelope: \"You can already read the first line! You'll find out who wrote it in Łódź.\""]},{"u":"lod","pl":"Mam na imię Ania. Jestem z Polski i mieszkam we Wrocławiu.","tr":["Ich heiße Ania. Ich komme aus Polen und wohne in Breslau.","My name is Ania. I'm from Poland and I live in Wrocław."],"bridge":["„Ania heißt sie also!“, ruft Szymek. „In Poznań wird gezählt. Da steht eine Zahl im Brief.“","\"So her name is Ania!\" Szymek calls out. \"In Poznań we count. There's a number in the letter.\""]},{"u":"poz","pl":"Mam dwadzieścia osiem lat.","tr":["Ich bin achtundzwanzig Jahre alt.","I'm twenty-eight years old."],"bridge":["„Achtundzwanzig. Und was mag sie? Das findest du in Szczecin heraus, beim Kaffee.“","\"Twenty-eight. And what does she like? You'll find out in Szczecin, over coffee.\""]},{"u":"szc","pl":"Lubię kawę bez cukru i dobre ciasto.","tr":["Ich mag Kaffee ohne Zucker und guten Kuchen.","I like coffee without sugar and good cake."],"bridge":["„Kaffee ohne Zucker, wie ich!“, lacht Szymek. „In Gdańsk geht es um ihre Familie.“","\"Coffee without sugar, just like me!\" Szymek laughs. \"In Gdańsk it's about her family.\""]},{"u":"gda","pl":"Mam brata, siostrę i kota.","tr":["Ich habe einen Bruder, eine Schwester und eine Katze.","I have a brother, a sister and a cat."],"bridge":["„Eine Katze …“ Szymek schaudert. „In Toruń lesen wir, wann Ania ihre Briefe schreibt.“","\"A cat …\" Szymek shudders. \"In Toruń we'll read when Ania writes her letters.\""]},{"u":"tor","pl":"W sobotę rano zawsze piszę listy.","tr":["Samstags morgens schreibe ich immer Briefe.","On Saturday mornings I always write letters."],"bridge":["„Samstag früh, also hat sie den Brief an einem Samstag geschrieben.“ In Białystok verrät er, wie das Wetter bei ihr ist.","\"Saturday morning, so she wrote this letter on a Saturday.\" In Białystok it tells you what the weather is like where she lives."]},{"u":"bia","pl":"Teraz jest jesień i często pada deszcz.","tr":["Jetzt ist Herbst, und es regnet oft.","It's autumn now and it often rains."],"bridge":["„Regen in Wrocław. Gut, dass ich eine Mütze habe.“ In Lublin erfährst du, warum Ania überhaupt schreibt.","\"Rain in Wrocław. Good thing I've got a hat.\" In Lublin you'll find out why Ania is writing at all."]},{"u":"lub","pl":"Szukam przyjaciela, który uczy się polskiego.","tr":["Ich suche jemanden zum Befreunden, der Polnisch lernt.","I'm looking for a friend who is learning Polish."],"bridge":["Szymek wird still. „Jemand, der Polnisch lernt … Das bist ja du!“ In Kraków steht, wo sie wohnt.","Szymek goes quiet. \"Someone who is learning Polish … that's you!\" In Kraków it says where she lives."]},{"u":"kra","pl":"Mieszkam blisko Rynku, obok muzeum.","tr":["Ich wohne nahe am Marktplatz, neben dem Museum.","I live near the market square, next to the museum."],"bridge":["„Neben dem Museum! Da kenne ich jeden Pflasterstein.“ In Zakopane geht es um die Anreise.","\"Next to the museum! I know every cobblestone there.\" In Zakopane it's about getting there."]},{"u":"zak","pl":"Jeśli przyjedziesz pociągiem, będę czekać na peronie.","tr":["Wenn du mit dem Zug kommst, warte ich am Bahnsteig.","If you come by train, I'll wait on the platform."],"bridge":["„Sie wartet am Bahnsteig. Jetzt fehlt nur noch der Termin.“ Weiter nach Katowice.","\"She'll wait on the platform. Now all that's missing is a date.\" On to Katowice."]},{"u":"kat","pl":"Proponuję spotkanie. Termin wybierasz ty.","tr":["Ich schlage ein Treffen vor. Den Termin wählst du.","I suggest we meet. You choose the date."],"bridge":["„Ein Treffen!“ Szymek packt seine Posttasche. „Nur noch ein Satz, in Wrocław, bei mir zu Hause.“","\"A meeting!\" Szymek packs his mailbag. \"Just one more sentence, in Wrocław, my home.\""]},{"u":"wro","pl":"Dbaj o zdrowie! Jeśli czytasz ten list, to już rozumiesz po polsku. Do zobaczenia! Ania","tr":["Pass auf dich auf! Wenn du diesen Brief liest, verstehst du schon Polnisch. Bis bald! Ania","Take care of yourself! If you're reading this letter, you already understand Polish. See you soon! Ania"]}]},"missions":{"waw":{"pl":"Dzień dobry! Dziękuję!","d":["Sag heute zu einem echten Menschen „Dzień dobry“ oder „Dziękuję“: in der Bäckerei, zur Nachbarin, im Videoanruf. Ein Lächeln zählt mit.","Say “Dzień dobry” or “Dziękuję” to a real person today: at the bakery, to a neighbour, on a video call. A smile counts too."]},"lod":{"pl":"Mam na imię … i jestem z …","d":["Stell dich laut auf Polnisch vor: Name, woher du kommst, wo du wohnst. Vor dem Spiegel oder als Sprachnachricht an dich selbst.","Introduce yourself out loud in Polish: name, where you are from, where you live. In front of the mirror or as a voice message to yourself."]},"poz":{"pl":"Ile to kosztuje?","d":["Nimm beim nächsten Einkauf drei Preise vom Kassenzettel und sag sie laut auf Polnisch: „To kosztuje … złotych.“","Take three prices from your next receipt and say them out loud in Polish: “To kosztuje … złotych.”"]},"szc":{"pl":"Poproszę kawę.","d":["Bestelle dein nächstes Getränk zuerst auf Polnisch, laut oder im Kopf, bevor du es auf Deutsch bestellst.","Order your next drink in Polish first, out loud or in your head, before you order it in your own language."]},"gda":{"pl":"To jest mój brat. To jest moja mama.","d":["Nimm ein Familienfoto und stell drei Menschen darauf auf Polnisch vor.","Take a family photo and introduce three people on it in Polish."]},"tor":{"pl":"Dziś jest poniedziałek. Jest ósma.","d":["Sag morgen früh beim Aufstehen den Wochentag und die Uhrzeit auf Polnisch.","Tomorrow morning when you get up, say the day of the week and the time in Polish."]},"bia":{"pl":"Dziś jest zimno i pada deszcz.","d":["Schau aus dem Fenster und beschreibe das Wetter in einem polnischen Satz.","Look out of the window and describe the weather in one Polish sentence."]},"lub":{"pl":"Lista zakupów: chleb, mleko, jabłka …","d":["Schreib deine nächste Einkaufsliste auf Polnisch, mindestens fünf Sachen.","Write your next shopping list in Polish, at least five items."]},"kra":{"pl":"Prosto, potem w lewo.","d":["Beschreib auf Polnisch den Weg von deiner Haustür zum nächsten Laden: prosto, w lewo, w prawo.","Describe in Polish the way from your front door to the nearest shop: prosto, w lewo, w prawo."]},"zak":{"pl":"Jadę do pracy autobusem.","d":["Sag bei deiner nächsten Fahrt laut, wohin du fährst und womit.","On your next trip, say out loud where you are going and how."]},"kat":{"pl":"Pracuję jako … Lubię moją pracę.","d":["Erzähl in drei polnischen Sätzen, was du arbeitest oder lernst.","Tell in three Polish sentences what you do for work or study."]},"wro":{"pl":"To jest głowa, ręka, noga …","d":["Zeig auf fünf Körperteile und benenne sie auf Polnisch. Mit Kindern macht es doppelt Spaß.","Point to five body parts and name them in Polish. Twice the fun with kids."]},"sop":{"pl":"W weekend {byłem|byłam} w …","d":["Erzähl heute jemandem – oder laut dir selbst – auf Polnisch, wo du am Wochenende warst und wie es war: „W weekend byłem / byłam w … Było super!“","Tell someone today – or yourself, out loud – in Polish where you were at the weekend and what it was like: “W weekend byłem / byłam w … Było super!”"]},"mal":{"pl":"Najpierw …, potem …, na końcu …","d":["Beschreibe deinen heutigen Tag in drei Schritten auf Polnisch (zuerst, dann, am Ende) – in Gedanken oder als Sprachnachricht.","Describe your day today in three steps in Polish (first, then, at the end) – in your head or as a voice message."]},"giz":{"pl":"Coś na ból głowy, proszę.","d":["Schau in deinen Medikamentenschrank: Wie heißen drei Dinge darin auf Polnisch? Schlag sie nach und sprich sie laut.","Look in your medicine cabinet: what are three things in it called in Polish? Look them up and say them out loud."]},"ols":{"pl":"W kuchni jest …","d":["Geh durch deine Wohnung und benenne in jedem Raum drei Dinge auf Polnisch: „W kuchni jest lodówka, stół i …“","Walk through your home and name three things in each room in Polish: “W kuchni jest lodówka, stół i …”"]},"plo":{"pl":"Pójdziemy w sobotę do kina?","d":["Schick jemandem eine Einladung auf Polnisch (oder schreib sie dir auf): was, wann, wo? „Pójdziemy w sobotę do kina? Spotkamy się o siódmej.“","Send someone an invitation in Polish (or write it down): what, when, where? “Pójdziemy w sobotę do kina? Spotkamy się o siódmej.”"]},"cze":{"pl":"Imię, nazwisko, adres, podpis","d":["Füll auf einem Zettel ein ausgedachtes polnisches Formular aus: imię, nazwisko, adres, kod pocztowy, podpis.","Fill in an imaginary Polish form on a piece of paper: imię, nazwisko, adres, kod pocztowy, podpis."]},"san":{"pl":"Moim zdaniem …","d":["Sag heute zu drei Dingen deine Meinung auf Polnisch: zum Wetter, zum Essen, zu einem Film. „Moim zdaniem …“","Give your opinion in Polish on three things today: the weather, food, a film. “Moim zdaniem …”"]},"bie":{"pl":"Pomocy! 112","d":["Merke dir die Notrufnummern in Polen: 112 (allgemein) und 985 (Bergwacht GOPR). Speichere sie im Handy – und sag einmal laut: „Pomocy!“","Remember Poland’s emergency numbers: 112 (general) and 985 (GOPR mountain rescue). Save them in your phone – and say “Pomocy!” out loud once."]},"prz":{"pl":"Halo, słucham?","d":["Melde dich heute einmal auf Polnisch am Telefon („Halo, słucham?“) – oder spiel ein Telefonat mit dir selbst und vereinbare einen ausgedachten Termin.","Answer the phone in Polish once today (“Halo, słucham?”) – or role-play a call with yourself and arrange an imaginary appointment."]},"tar":{"pl":"Smacznego!","d":["Koch oder bestell heute etwas Polnisches – oder lies ein polnisches Rezept und such drei Verben im Imperativ (pokrój, dodaj, mieszaj …).","Cook or order something Polish today – or read a Polish recipe and find three verbs in the imperative (pokrój, dodaj, mieszaj …)."]},"opo":{"pl":"Wszystkiego najlepszego!","d":["Schau im Kalender nach, wer bald Geburtstag oder Namenstag hat, und gratuliere auf Polnisch.","Check your calendar for someone with an upcoming birthday or name day and congratulate them in Polish."]},"kar":{"pl":"Kiedyś, teraz, w przyszłości","d":["Erzähl in drei Sätzen deine Polnisch-Geschichte: Wie war es am Anfang, was kannst du jetzt, was willst du in Zukunft?","Tell your Polish story in three sentences: what was it like at the start, what can you do now, what do you want to do in future?"]},"jel":{"pl":"Pracuję jako … Lubię moją pracę, bo …","d":["Erzähl heute einem Menschen – oder im KI-Gespräch – in drei, vier Sätzen auf Polnisch von deiner Arbeit: was du machst, seit wann und was du daran magst.","Tell a person today – or the AI conversation – about your work in three or four Polish sentences: what you do, since when and what you like about it."]},"klo":{"pl":"Przepraszam, mam problem: …","d":["Spiel mit jemandem – oder im KI-Gespräch – eine Reklamation durch: Etwas ist kaputt oder nicht angekommen. Erkläre das Problem auf Polnisch und sag, was du möchtest (Umtausch, Geld zurück, Bestätigung).","Act out a complaint with someone – or in the AI conversation: something is broken or didn’t arrive. Explain the problem in Polish and say what you want (exchange, refund, confirmation)."]},"zie":{"pl":"Poznaliśmy się …","d":["Erzähl einem Menschen – oder im KI-Gespräch – auf Polnisch, wie du einen wichtigen Menschen in deinem Leben kennengelernt hast: wo, wann und was zuerst passiert ist.","Tell a person – or the AI conversation – in Polish how you met someone important in your life: where, when and what happened first."]},"gni":{"pl":"Najpierw … potem … nagle … w końcu …","d":["Erzähl einem Menschen – oder im KI-Gespräch – auf Polnisch eine kurze Geschichte aus deiner Familie oder deinem Leben. Benutze najpierw, potem, nagle und w końcu.","Tell a person – or the AI conversation – a short story from your family or your life in Polish. Use najpierw, potem, nagle and w końcu."]},"byd":{"pl":"Mam problem w mieszkaniu: od wczoraj nie działa …","d":["Ruf jemanden an – oder nutze das KI-Gespräch – und melde auf Polnisch einen Schaden in der Wohnung: Was ist kaputt, seit wann, und wann soll jemand kommen?","Call someone – or use the AI conversation – and report a fault in your flat in Polish: what’s broken, since when, and when someone should come."]},"leb":{"pl":"Dla mnie najpiękniejsze miejsce to … Jest piękniejsze niż …","d":["Erzähl jemandem – oder im KI-Gespräch – auf Polnisch, welcher Ort in der Natur für dich der schönste ist, und vergleiche ihn mit einem anderen Ort: „… jest piękniejszy niż …“","Tell someone – or the AI conversation – in Polish which place in nature you find the most beautiful, and compare it with another place: “… jest piękniejszy niż …”"]},"hel":{"pl":"Według prognozy jutro będzie …","d":["Hör oder lies heute eine kurze polnische Nachricht oder den Wetterbericht (zum Beispiel über den Radio-Link dieser Stadt). Erzähl danach jemandem – oder im KI-Gespräch – in zwei, drei Sätzen, worum es ging.","Listen to or read a short Polish news item or the weather forecast today (for example via this town’s radio link). Then tell someone – or the AI conversation – in two or three sentences what it was about."]},"elb":{"pl":"Od tygodnia boli mnie … Kiedy jest najbliższy termin?","d":["Spiel mit jemandem – oder im KI-Gespräch – eine Terminvereinbarung beim Facharzt durch: Beschwerden schildern, nach dem nächsten Termin fragen, Kosten klären.","Act out booking a specialist appointment with someone – or in the AI conversation: describe your symptoms, ask for the next appointment, clarify the cost."]},"aug":{"pl":"Żeby przedłużyć dowód, trzeba …","d":["Erklär jemandem – oder im KI-Gespräch – auf Polnisch, wie bei dir ein Behördengang funktioniert (zum Beispiel einen Ausweis verlängern): Was braucht man, wohin geht man, wie lange dauert es? Benutze trzeba und należy.","Explain to someone – or the AI conversation – in Polish how an official errand works where you live (for example renewing an ID card): what you need, where you go, how long it takes. Use trzeba and należy."]},"kaz":{"pl":"Ostatnio {widziałem|widziałam} … Podobał mi się, bo …","d":["Erzähl jemandem – oder im KI-Gespräch – von einem Film, Buch oder einer Serie, die du zuletzt gesehen oder gelesen hast: Worum geht es, hat es dir gefallen, und warum?","Tell someone – or the AI conversation – about a film, book or series you saw or read recently: what it’s about, whether you liked it and why."]},"ojc":{"pl":"{Gdybym miał|Gdybym miała} rok wolnego, {zrobiłbym|zrobiłabym} …","d":["Sprich mit jemandem – oder im KI-Gespräch – über Träume: Was würdest du machen, wenn du ein Jahr frei hättest? Sag mindestens drei Sätze mit gdyby.","Talk with someone – or the AI conversation – about dreams: what would you do if you had a year off? Say at least three sentences with gdyby."]},"wie":{"pl":"Najważniejsi ludzie, których {spotkałem|spotkałam}, to …","d":["Erzähl einem Menschen auf Polnisch – am besten jemandem, der Polnisch als Muttersprache spricht – in fünf, sechs Sätzen Ewas Geschichte oder deine eigene Geschichte mit Polnisch. Benutze który, która, które.","Tell a person in Polish – ideally a native speaker – Ewa’s story or your own story with Polish in five or six sentences. Use który, która, które."]}},"listen":{"radio":{"waw":["Polskie Radio","https:/ Alltagspolnisch.","Street interviews with subtitles (Polish, English). Real everyday Polish."],["Real Polish","https://realpolish.pl/","Podcast mit einfachem, langsam gesprochenem Polnisch.","Podcast with simple, slowly spoken Polish."],["PolishPod101","https://www.polishpod101.com/","Kurze Hörlektionen für Anfänger (teils kostenpflichtig).","Short audio lessons for beginners (partly paid)."],["TVP VOD","https://vod.tvp.pl/","Polnisches Fernsehen online: Serien, Nachrichten, Kinderprogramm.","Polish TV online: series, news, children's programmes."],["Mówiąc Inaczej","https://www.youtube.com/@MowiacInaczej","Für Fortgeschrittene: polnische Sprache erklärt von Polen für Polen.","For advanced learners: the Polish language explained by Poles for Poles."]]},"aspects":[{"s":"Codziennie ___ kawę.","base":"pić / wypić","opts":["piję","wypiję"],"a":"piję","pf":0,"why":["„codziennie“ (jeden Tag) ist eine Gewohnheit, dafür nimmt man das unvollendete Verb.","“codziennie” (every day) is a habit, so you use the imperfective verb."],"tr":["Jeden Tag trinke ich Kaffee.","I drink coffee every day."]},{"s":"Jutro ___ ten list.","base":"pisać / napisać","opts":["napiszę","piszę"],"a":"napiszę","pf":1,"why":["Eine einzelne Handlung morgen, die fertig wird: vollendet. „napiszę“ ist schon Zukunft.","A single action tomorrow that gets finished: perfective. “napiszę” already means future."],"tr":["Morgen schreibe ich diesen Brief (fertig).","Tomorrow I will write this letter (and finish it)."]},{"s":"Wczoraj Ania ___ cały film.","base":"oglądać / obejrzeć","opts":["obejrzała","oglądała"],"a":"obejrzała","pf":1,"why":["„cały“ (ganz): Der Film ist zu Ende geschaut, das Ergebnis zählt, also vollendet.","“cały” (whole): the film was watched to the end, the result counts, so perfective."],"tr":["Gestern hat Ania den ganzen Film angeschaut.","Yesterday Ania watched the whole film."]},{"s":"Kiedy Ania ___ obiad, zadzwonił telefon.","base":"gotować / ugotować","opts":["gotowała","ugotowała"],"a":"gotowała","pf":0,"why":["Das Kochen lief gerade, als etwas passierte: Hintergrund-Handlung, also unvollendet.","The cooking was in progress when something happened: background action, so imperfective."],"tr":["Als Ania das Mittagessen kochte, klingelte das Telefon.","While Ania was cooking lunch, the phone rang."]},{"s":"Często ___ listy do Ani.","base":"pisać / napisać","opts":["piszę","napiszę"],"a":"piszę","pf":0,"why":["„często“ (oft) heißt Wiederholung, also unvollendet.","“często” (often) means repetition, so imperfective."],"tr":["Ich schreibe oft Briefe an Ania.","I often write letters to Ania."]},{"s":"Proszę, ___ okno!","base":"otwierać / otworzyć","opts":["otwórz","otwieraj"],"a":"otwórz","pf":1,"why":["Eine einmalige Bitte mit Ergebnis (Fenster auf): vollendeter Imperativ.","A one-off request with a result (window open): perfective imperative."],"tr":["Bitte mach das Fenster auf!","Please open the window!"]},{"s":"Tomek już ___ zadanie.","base":"robić / zrobić","opts":["zrobił","robił"],"a":"zrobił","pf":1,"why":["„już“ (schon): Die Aufgabe ist erledigt, das Ergebnis liegt vor, also vollendet.","“już” (already): the task is done, the result is there, so perfective."],"tr":["Tomek hat die Aufgabe schon gemacht.","Tomek has already done the task."]},{"s":"Codziennie rano ___ gazetę.","base":"czytać / przeczytać","opts":["czytam","przeczytam"],"a":"czytam","pf":0,"why":["Jeden Morgen: Gewohnheit, also unvollendet.","Every morning: a habit, so imperfective."],"tr":["Jeden Morgen lese ich die Zeitung.","Every morning I read the newspaper."]},{"s":"Za chwilę ___ ci, jak to działa.","base":"pokazywać / pokazać","opts":["pokażę","pokazuję"],"a":"pokażę","pf":1,"why":["„za chwilę“ (gleich): einmal, mit Ergebnis, in der Zukunft, also vollendet.","“za chwilę” (in a moment): once, with a result, in the future, so perfective."],"tr":["Gleich zeige ich dir, wie das funktioniert.","In a moment I will show you how it works."]},{"s":"Przez dwie godziny Ola ___ na pociąg.","base":"czekać / zaczekać","opts":["czekała","zaczekała"],"a":"czekała","pf":0,"why":["„przez dwie godziny“ (zwei Stunden lang) betont die Dauer, also unvollendet.","“przez dwie godziny” (for two hours) stresses duration, so imperfective."],"tr":["Zwei Stunden lang wartete Ola auf den Zug.","Ola waited for the train for two hours."]},{"s":"Kiedy ___ pracę, zadzwonię do ciebie.","base":"kończyć / skończyć","opts":["skończę","kończę"],"a":"skończę","pf":1,"why":["Erst fertig werden, dann anrufen: abgeschlossene Handlung in der Zukunft, also vollendet.","First finish, then call: a completed action in the future, so perfective."],"tr":["Wenn ich mit der Arbeit fertig bin, rufe ich dich an.","When I finish work, I will call you."]},{"s":"Marek ___ list i wysłał go.","base":"pisać / napisać","opts":["napisał","pisał"],"a":"napisał","pf":1,"why":["Eine Handlung nach der anderen, jede abgeschlossen: vollendet.","One action after another, each completed: perfective."],"tr":["Marek schrieb den Brief und schickte ihn ab.","Marek wrote the letter and sent it."]},{"s":"Zwykle ___ o siódmej.","base":"wstawać / wstać","opts":["wstaję","wstanę"],"a":"wstaję","pf":0,"why":["„zwykle“ (normalerweise): Gewohnheit, also unvollendet.","“zwykle” (usually): a habit, so imperfective."],"tr":["Normalerweise stehe ich um sieben auf.","I usually get up at seven."]},{"s":"Nie mogę rozmawiać, teraz ___.","base":"jeść / zjeść","opts":["jem","zjem"],"a":"jem","pf":0,"why":["Gerade jetzt, im Verlauf: unvollendet. Vollendete Verben haben keine Gegenwart („zjem“ ist Zukunft).","Right now, in progress: imperfective. Perfective verbs have no present tense (“zjem” is future)."],"tr":["Ich kann nicht reden, ich esse gerade.","I can't talk, I'm eating right now."]},{"s":"Ola ___ całą pizzę sama!","base":"jeść / zjeść","opts":["zjadła","jadła"],"a":"zjadła","pf":1,"why":["Die ganze Pizza ist weg, das Ergebnis zählt: vollendet.","The whole pizza is gone, the result counts: perfective."],"tr":["Ola hat die ganze Pizza allein aufgegessen!","Ola ate the whole pizza by herself!"]},{"s":"Jutro cały dzień będę ___.","base":"pracować / popracować","opts":["pracować","popracować"],"a":"pracować","pf":0,"why":["„będę“ + Infinitiv gibt es nur mit unvollendeten Verben. Dazu: den ganzen Tag (Dauer).","“będę” + infinitive only works with imperfective verbs. Also: all day (duration)."],"tr":["Morgen werde ich den ganzen Tag arbeiten.","Tomorrow I will work all day."]}],"letterQuiz":[{"l":1,"q":["Wie heißt die Schreiberin, und wo wohnt sie?","What is the writer called, and where does she live?"],"o":[["Ania, in Breslau (Wrocław)","Ania, in Wrocław"],["Ola, in Łódź","Ola, in Łódź"],["Ania, in Krakau","Ania, in Kraków"]]},{"l":2,"q":["Wie alt ist Ania?","How old is Ania?"],"o":[["28","28"],["22","22"],["38","38"]]},{"l":3,"q":["Was mag Ania?","What does Ania like?"],"o":[["Kaffee ohne Zucker und guten Kuchen","Coffee without sugar and good cake"],["Tee mit Zucker und Brot","Tea with sugar and bread"],["Kaffee mit Milch und Eis","Coffee with milk and ice cream"]]},{"l":4,"q":["Wer gehört zu Anias Familie?","Who is in Ania's family?"],"o":[["ein Bruder, eine Schwester und eine Katze","a brother, a sister and a cat"],["zwei Schwestern und ein Hund","two sisters and a dog"],["ein Bruder und eine Großmutter","a brother and a grandmother"]]},{"l":5,"q":["Wann schreibt Ania Briefe?","When does Ania write letters?"],"o":[["samstags morgens","on Saturday mornings"],["sonntags abends","on Sunday evenings"],["jeden Abend","every evening"]]},{"l":6,"q":["Wie ist es gerade bei Ania?","What is it like at Ania's right now?"],"o":[["Herbst, es regnet oft","autumn, it often rains"],["Sommer, es ist sehr heiß","summer, it is very hot"],["Winter, es schneit","winter, it is snowing"]]},{"l":7,"q":["Wen sucht Ania?","Who is Ania looking for?"],"o":[["jemanden, der Polnisch lernt","someone who is learning Polish"],["eine Polnischlehrerin","a Polish teacher"],["eine neue Wohnung","a new flat"]]},{"l":8,"q":["Wo wohnt Ania genau?","Where exactly does Ania live?"],"o":[["nahe am Marktplatz, neben dem Museum","near the Market Square, next to the museum"],["direkt am Bahnhof","right by the station"],["außerhalb der Stadt","outside the city"]]},{"l":9,"q":["Wo wartet Ania, wenn du mit dem Zug kommst?","Where will Ania wait if you come by train?"],"o":[["auf dem Bahnsteig","on the platform"],["im Café","in the café"],["zu Hause","at home"]]},{"l":10,"q":["Wer wählt den Termin für das Treffen?","Who chooses the date for the meeting?"],"o":[["du","you"],["Ania","Ania"],["Szymek","Szymek"]]}],"audio":{},"verbs":[{"inf":"być","de":"sein","en":"to be","cls":"irr","pres":["jestem","jesteś","jest","jesteśmy","jesteście","są"],"past":["byłem","byłam","był","była","byli"]},{"inf":"mieć","de":"haben","en":"to have","cls":"am","pres":["mam","masz","ma","mamy","macie","mają"],"past":["miałem","miałam","miał","miała","mieli"]},{"inf":"czytać","de":"lesen","en":"to read","cls":"am","pres":["czytam","czytasz","czyta","czytamy","czytacie","czytają"],"past":["czytałem","czytałam","czytał","czytała","czytali"]},{"inf":"mieszkać","de":"wohnen","en":"to live (reside)","cls":"am","pres":["mieszkam","mieszkasz","mieszka","mieszkamy","mieszkacie","mieszkają"],"past":["mieszkałem","mieszkałam","mieszkał","mieszkała","mieszkali"]},{"inf":"pytać","de":"fragen","en":"to ask","cls":"am","pres":["pytam","pytasz","pyta","pytamy","pytacie","pytają"],"past":["pytałem","pytałam","pytał","pytała","pytali"]},{"inf":"słuchać","de":"zuhören, hören","en":"to listen","cls":"am","pres":["słucham","słuchasz","słucha","słuchamy","słuchacie","słuchają"],"past":["słuchałem","słuchałam","słuchał","słuchała","słuchali"]},{"inf":"czekać","de":"warten","en":"to wait","cls":"am","pres":["czekam","czekasz","czeka","czekamy","czekacie","czekają"],"past":["czekałem","czekałam","czekał","czekała","czekali"]},{"inf":"znać","de":"kennen","en":"to know (someone/something)","cls":"am","pres":["znam","znasz","zna","znamy","znaci "past":["nazywałem się","nazywałam się","nazywał się","nazywała się","nazywali się"]}],"diary":{"prolog":["Szymek wedelt mit einer Postkarte: „Ania reist dir voraus durch Polen! In jeder Stadt lässt sie dir eine Karte da – auf Polnisch, und diesmal erzählt sie, was sie erlebt hat. Am Ende wartet sie oben auf der Schneekoppe.“","Szymek waves a postcard: “Ania is travelling ahead of you through Poland! In every town she leaves you a card – in Polish, and this time she tells you what she has been up to. At the end she’ll be waiting on top of Śnieżka.”"],"finale":["Śnieżka, 1603 Meter, Sonnenaufgang. Ania, Kasia und Szymek warten am Gipfel. Ania drückt dir ein Buch in die Hand – ganz auf Polnisch. „Das nächste Kapitel“, sagt sie, „liest du allein.“","Śnieżka, 1,603 metres, sunrise. Ania, Kasia and Szymek are waiting at the summit. Ania hands you a book – entirely in Polish. “The next chapter,” she says, “you’ll read on your own.”"],"lines":[{"u":"sop","pl":"Cześć! Wczoraj byłam w Sopocie i kąpałam się w morzu. Woda była zimna!","tr":["Hallo! Gestern war ich in Sopot und habe im Meer gebadet. Das Wasser war kalt!","Hi! Yesterday I was in Sopot and swam in the sea. The water was cold!"],"bridge":["Szymek dreht die Karte um: „Hinten ist eine Burg aus roten Ziegeln gemalt. Das kann nur Malbork sein!“","Szymek turns the card over: “There’s a red-brick castle drawn on the back. That can only be Malbork!”"]},{"u":"mal","pl":"W Malborku zwiedziłam ogromny zamek. Przewodnik mówił bardzo szybko.","tr":["In Malbork habe ich eine riesige Burg besichtigt. Der Führer hat sehr schnell gesprochen.","In Malbork I toured an enormous castle. The guide spoke very fast."],"bridge":["Szymek: „Ania fährt weiter zu den Seen in Masuren. Hoffentlich bekommt sie im kalten Wasser kein Fieber …“","Szymek: “Ania is heading on to the Masurian lakes. Let’s hope the cold water doesn’t give her a fever …”"]},{"u":"giz","pl":"Na Mazurach się przeziębiłam. Lekarka dała mi receptę i dużo herbaty.","tr":["In Masuren habe ich mich erkältet. Die Ärztin hat mir ein Rezept und viel Tee gegeben.","In Masuria I caught a cold. The doctor gave me a prescription and lots of tea."],"bridge":["Szymek: „Gute Besserung, Ania! Die nächste Karte kommt aus Olsztyn – dort wollte sie eine Wohnung anschauen.“","Szymek: “Get well soon, Ania! The next card comes from Olsztyn – she wanted to look at a flat there.”"]},{"u":"ols","pl":"W Olsztynie wynajęłam małe mieszkanie z balkonem. Kuchnia jest malutka!","tr":["In Olsztyn habe ich eine kleine Wohnung mit Balkon gemietet. Die Küche ist winzig!","In Olsztyn I rented a small flat with a balcony. The kitchen is tiny!"],"bridge":["Szymek: „Auf der Karte steht: ‚Treffen wir uns in Płock?‘ Hoffentlich hast du dein Handy dabei.“","Szymek: “The card says: ‘Shall we meet in Płock?’ I hope you’ve got your phone with you.”"]},{"u":"plo","pl":"W Płocku czekałam na ciebie nad Wisłą, ale musiałam jechać dalej. Przepraszam!","tr":["In Płock habe ich an der Weichsel auf dich gewartet, aber ich musste weiterfahren. Entschuldige!","In Płock I waited for you by the Vistula, but I had to move on. Sorry!"],"bridge":["Szymek: „Ania musste weg, ein Brief vom Amt. Sie ist schon nach Częstochowa gefahren.“","Szymek: “Ania had to leave – a letter from the authorities. She’s already gone to Częstochowa.”"]},{"u":"cze","pl":"W Częstochowie czekałam na poczcie godzinę. Ale w końcu wysłałam paczkę!","tr":["In Tschenstochau habe ich auf der Post eine Stunde gewartet. Aber endlich habe ich das Paket abgeschickt!","In Częstochowa I waited at the post office for an hour. But I finally sent the parcel!"],"bridge":["Szymek: „Das Paket ist für dich! Es wartet in Sandomierz.“","Szymek: “The parcel is for you! It’s waiting in Sandomierz.”"]},{"u":"san","pl":"Sandomierz bardzo mi się podobał. Myślę, że to najpiękniejsze miasteczko w Polsce.","tr":["Sandomierz hat mir sehr gefallen. Ich finde, das ist das schönste Städtchen in Polen.","I really liked Sandomierz. I think it’s the most beautiful little town in Poland."],"bridge":["Szymek: „Im Paket: Wanderschuhe! Ania schreibt: ‚Die brauchst du in den Bieszczady.‘“","Szymek: “In the parcel: hiking boots! Ania writes: ‘You’ll need these in the Bieszczady.’”"]},{"u":"bie","pl":"W Bieszczadach szłam cały dzień i nie spotkałam nikogo. Tylko jelenia!","tr":["In den Bieszczady bin ich den ganzen Tag gewandert und habe niemanden getroffen. Nur einen Hirsch!","In the Bieszczady I walked all day and didn’t meet anyone. Only a deer!"],"bridge":["Szymek: „Ania hat angerufen, aber du hattest keinen Empfang. Sie versucht es aus Przemyśl noch einmal.“","Szymek: “Ania called, but you had no signal. She’ll try again from Przemyśl.”"]},{"u":"prz","pl":"Z Przemyśla dzwoniłam trzy razy. Umówmy się w piątek w Tarnowie, dobrze?","tr":["Aus Przemyśl habe ich dreimal angerufen. Verabreden wir uns am Freitag in Tarnów, okay?","I called three times from Przemyśl. Let’s meet in Tarnów on Friday, OK?"],"bridge":["Szymek: „Freitag, Tarnów, ein Restaurant am Markt. Du hast doch reserviert, oder?“","Szymek: “Friday, Tarnów, a restaurant on the market square. You did book, didn’t you?”"]},{"u":"tar","pl":"W Tarnowie zjadłam najlepsze pierogi w życiu. Kucharz dał mi przepis!","tr":["In Tarnów habe ich die besten Piroggen meines Lebens gegessen. Der Koch hat mir das Rezept gegeben!","In Tarnów I ate the best pierogi of my life. The cook gave me the recipe!"],"bridge":["Szymek: „Jetzt fährt sie nach Opole – dort gibt es ein großes Musikfestival.“","Szymek: “Now she’s off to Opole – there’s a big music festival there.”"]},{"u":"opo","pl":"W Opolu byłam na koncercie i śpiewałam razem z całą publicznością.","tr":["In Opole war ich auf einem Konzert und habe mit dem ganzen Publikum gesungen.","In Opole I went to a concert and sang along with the whole audience."],"bridge":["Szymek: „Letzte Karte: ‚Wir sehen uns auf der Śnieżka, bei Sonnenaufgang. Zieh dich warm an!‘“","Szymek: “Last card: ‘See you on Śnieżka at sunrise. Wrap up warm!’”"]},{"u":"kar","pl":"Jutro rano będę na Śnieżce. Mam dla ciebie niespodziankę.","tr":["Morgen früh bin ich auf der Schneekoppe. Ich habe eine Überraschung für dich.","Tomorrow morning I’ll be on Śnieżka. I have a surprise for you."]}]},"themes":[{"id":"arzt","ico":"🩺","t":["Arztbesuch & Gesundheit","Doctor & health"],"u":["wro","giz","pra","nfa","elb"]},{"id":"essen","ico":"🍽","t":["Essen & Restaurant","Food & restaurants"],"u":["szc","tar"]},{"id":"einkaufen","ico":"🛍","t":["Einkaufen, Geld & Zahlen","Shopping, money & numbers"],"u":["poz","lub","cze"]},{"id":"reisen","ico":"🧳","t":["Unterwegs & Reisen","Getting around & travel"],"u":["waw","kra","zak","sop","bie","klo","wie"]},{"id":"wohnen","ico":"🏠","t":["Wohnen, Zeit & Wetter","Home, time & weather"],"u":["ols","tor","bia","byd","hel"]},{"id":"leute","ico":"💬","t":["Menschen, Familie & Treffen","People, family & meeting up"],"u":["lod","gda","plo","san","zie","ojc"]},{"id":"amt","ico":"📮","t":["Ämter, Post & Telefon","Offices, post & phone"],"u":["cze","prz","nfa","aug"]},{"id":"arbeit","ico":"💼","t":["Arbeit & Beruf","Work & career"],"u":["kat","pra","prz","jel"]},{"id":"freizeit","ico":"🎉","t":["Freizeit, Feste & Kultur","Free time, festivals & culture"],"u":["mal","opo","kar","gni","kaz"]},{"id":"natur","ico":"🌿","t":["Natur & Umwelt","Nature & environment"],"u":["bie","leb"]},{"id":"basis","ico":"🧱","t":["Grundwortschatz & Grammatik","Core vocabulary & grammar"],"u":["kwo","vrb","waw","lod"]}],"news":[{"v":"3.4","date":"2026-10-28","de":["Neu unter Ich → Stimme: zwei natürliche polnische Stimmen zur Wahl – Gosia (Frau) und Darek (Mann). Sie sprechen alle Wörter, Sätze, Szenen und Buchkapitel, auf jedem Gerät gleich. „Langsam sprechen“ funktioniert auch mit ihnen."],"en":["New under Me → Voice: two natural Polish voices to choose from – Gosia (female) and Darek (male). They speak all words, sentences, scenes and book chapters, the same on every device. “Speak slowly” works with them too."]},{"v":"3.3.1","date":"2026-10-28","de":["Impressum und Datenschutz sind jetzt auf jedem Bildschirm unten verlinkt. Die Datenschutzerklärung beschreibt auch die neuen Sicherungen und den Mail-Versand."],"en":["Legal notice and privacy policy are now linked at the bottom of every screen. The privacy policy also covers the new backups and the email service."]},{"v":"3.3","date":"2026-10-28","de":["Neu: Szlak 3 „Die Bücher“ (Weg zu B1) – 12 neue Orte von Jelenia Góra bis Wieliczka mit 480 Wörtern: Arbeit suchen, Reklamation, Beziehungen, Wohnung mieten, Facharzt, Ämter, Kunst, Träume.","In jeder Stadt ein Kapitel aus Anias Buch „Klucz z Wieliczki“ – eine spannende Geschichte zum Selberlesen, mit Vorlesen, Übersetzung auf Antippen und Verständnisfragen.","Neu unter Üben: die B1-Probeprüfung mit Hören, Grammatik, Lesen, Schreiben und Sprechen – ohne Zeitdruck, jedes Mal neue Aufgaben.","Szlak 3 ist noch Beta: Eine Muttersprachlerin aus Kraków prüft gerade alle Texte."],"en":["New: Szlak 3 “The Books” (on the way to B1) – 12 new towns from Jelenia Góra to Wieliczka with 480 words: job hunting, complaints, relationships, renting, specialists, offices, art, dreams.","In every town a chapter of Ania’s book “Klucz z Wieliczki” – an exciting story to read yourself, read aloud, with tap-to-translate and comprehension questions.","New under Practice: the B1 practice exam with listening, grammar, reading, writing and speaking – no time pressure, new tasks every time.","Szlak 3 is still in beta: a native speaker from Kraków is checking all the texts."]},{"v":"3.2","date":"2026-10-28","de":["Dein Fortschritt ist sicher: Die App sichert deinen Stand jetzt automatisch (die letzten 7 Tage und vor jedem Update). Unter Ich → „Dein Fortschritt ist sicher“ kannst du jede Sicherung zurückholen – dabei kommt nur dazu, was fehlt, es geht nie etwas verloren.","Neu: Fortschritt als Datei speichern und wieder laden. Ein beschädigter Spielstand wird automatisch repariert.","Mit Konto zusätzlich: tägliche Sicherung auf dem Server."],"en":["Your progress is safe: the app now backs up your progress automatically (the last 7 days and before every update). Under Me → “Your progress is safe” you can restore any backup – it only adds what is missing, nothing is ever lost.","New: save your progress as a file and load it again. A damaged save is repaired automatically.","With an account: daily backup on the server as well."]},{"v":"3.1.4","date":"2026-10-28","de":["Ton auf iPhone und iPad, wenn die App installiert ist: Die Sprachausgabe ist jetzt auch zu hören, wenn das iPhone auf lautlos steht (wie bei Videos)."],"en":["Sound on iPhone and iPad in the installed app: speech is now audible even when the iPhone is set to silent (like videos)."]},{"v":"3.1.3","date":"2026-10-28","de":["Ton auf iPhone und iPad: Die App spricht wieder wie früher mit der polnischen Standardstimme des Geräts. Bleibt es trotzdem einmal still, versucht sie es automatisch ein zweites Mal.","Neu unter Ich → Stimme: „Ton-Test mit Diagnose“ – zeigt, was dein Gerät meldet (hilft bei der Fehlersuche)."],"en":["Sound on iPhone and iPad: the app speaks again, as before, with the device’s default Polish voice. If it ever stays silent, it automatically tries a second time.","New under Me → Voice: “Sound test with diagnostics” – shows what your device reports (helps troubleshooting)."]},{"v":"3.1.2","date":"2026-10-28","de":["Eine neue Stadt gibt es erst, wenn alle Wörter der Stadt gelernt und an zwei verschiedenen Tagen gefestigt sind. Die Stadtprüfung lässt sich nicht mehr vorzeitig starten.","Der Weiter-Knopf führt immer zur ersten Stadt, deren Prüfung du noch nicht bestanden hast – auch wenn du Städte übersprungen hast.","Quiz, Hören, Schreiben und Paare fragen nur Wörter ab, die du schon kennengelernt hast.","Einstufungstest strenger: 3 Fragen pro Stadt.","Mac: Anleitung zum Installieren als App (Safari: Ablage → Zum Dock hinzufügen)."],"en":["A new city only opens once all of its words are learned and consolidated on two different days. The city test can no longer be started early.","The continue button always leads to the first city whose test you haven’t passed yet – even if you skipped cities.","Quiz, listening, writing and pairs only ask words you have already met.","Stricter placement test: 3 questions per city.","Mac: how to install as an app (Safari: File → Add to Dock)."]},{"v":"3.1.1","date":"2026-10-28","de":["Ton auf iPhone und iPad funktioniert wieder: Auf Apple-Geräten wählt jetzt das System die polnische Stimme.","Neu: diese Seite „Was ist neu“ – nach jedem Update siehst du hier, was sich geändert hat."],"en":["Sound works again on iPhone and iPad: on Apple devices the system now picks the Polish voice.","New: this “What’s new” page – after every update you’ll see what changed."]},{"v":"3.1","date":"2026-10-28","de":["KI-Gespräch (Beta): Spiel die Szene einer Stadt frei weiter – schreiben oder sprechen, mit Korrektur deiner Fehler. Mit Konto, 40 Nachrichten pro Tag.","Behoben: Die Einführungs-Tour konnte ein Spiel verdecken."],"en":["AI conversation (beta): continue a city’s scene freely – write or speak, with corrections. Needs an account, 40 messages a day.","Fixed: the intro tour could cover a game."]},{"v":"3.0","date":"2026-10-28","de":["Szlak 2 (A2): 12 neue Orte von Sopot bis Karpacz – Arzt, Wohnung, Post, Telefon, Restaurant, Feste und mehr. Dazu Anias Postkarten.","Nach Thema: alle Lektionen gebündelt, z. B. alles für den Arztbesuch.","Themenpakete: Praxis-Polnisch, Notfall, Kleine Wörter, 40 Verben – jetzt 728 Wörter.","Konjugations-Trainer, Sprecherform Mann/Frau, Aussprache-Rückmeldung je Wort, Wochenrückblick, Kalender-Erinnerung, Stimmen-Auswahl."],"en":["Szlak 2 (A2): 12 new places from Sopot to Karpacz – doctor, flat, post office, phone, restaurant, holidays and more. Plus Ania’s postcards.","By topic: all lessons bundled, e.g. everything for a doctor’s visit.","Topic packs: practice Polish, emergencies, little words, 40 verbs – now 728 words.","Conjugation trainer, speaker form man/woman, per-word pronunciation feedback, weekly review, calendar reminder, voice choice."]},{"v":"2.0","date":"2026-10-20","de":["Mini-Missionen für die echte Welt, Regionalradio pro Stadt, Verb-Aspekt-Übung, Fehler melden, Ergebnisse teilen, Brief-Quiz."],"en":["Real-world mini missions, regional radio per city, verb aspect practice, report a mistake, share results, letter quiz."]},{"v":"1.9","date":"2026-10-19","de":["Der Brief: Mit jeder Stadt wird ein Satz von Anias Brief lesbar."],"en":["The letter: every city makes one more line of Ania’s letter readable."]},{"v":"1.8","date":"2026-10-19","de":["Weiter-Knopf, Ausblick am Rundenende, Willkommen zurück nach einer Pause, „Das kann ich schon“."],"en":["Continue button, outlook at the end of a round, welcome back after a break, “What I can do”."]},{"v":"1.7","date":"2026-10-19","de":["Geräte-Abgleich mit Konto: gleicher Fortschritt auf Handy und Laptop."],"en":["Device sync with an account: same progress on phone and laptop."]}],"book":{"title":"Klucz z Wieliczki","prolog":["Du schlägst Anias Buch auf: „Klucz z Wieliczki“ – Der Schlüssel aus Wieliczka. Auf der ersten Seite steht in ihrer Schrift: „Lies in jeder Stadt ein Kapitel. Am Ende wartet ein Schatz unter der Erde.“","You open Ania’s book: “Klucz z Wieliczki” – The Key from Wieliczka. On the first page, in her handwriting: “Read one chapter in every town. At the end, a treasure is waiting underground.”"],"finale":["Du klappst das Buch zu. Auf der letzten Seite hat Ania geschrieben: „Jetzt bist du dran: Erzähl deine eigene Geschichte auf Polnisch. Bereit für die B1-Probeprüfung?“","You close the book. On the last page Ania has written: “Now it’s your turn: tell your own story in Polish. Ready for the B1 practice exam?”"]},"polacyLazy":"data-polacy.json","unitsLazy":1}</script>

  function runMatch(list, ui, th) {

      var left = pick.length - Object.keys(gone).length / 2;
      shell('<section class="game"><div class="game-top"><button class="icon-btn" id="quit" aria-label="' + esc(t('back')) + '">' + I.x + '</button><div class="bar"><i style="width:' + ((pick.length - left) / pick.length * 100) + '%"></i></div><span class="small num">' + left + ' ' + esc(t('pairs_left')) + '</span></div>' +
        '<div class="match-grid' + (th && !th.pairs[0].pl ? ' long' : '') + '">' + cards.map(function (c, i) { return '<button class="opt' + (gone[i] ? ' gone' : '') + (sel === i ? ' sel' : '') + '" data-c="' + i + '" lang="' + (c.pl ? 'pl' : S.base) + '"' + (gone[i] ? ' disabled' : '') + '>' + esc(c.txt) + '</button>'; }).join('') + '</div></section>', false);
      document.getElementById('quit').onclick = function () { G = null; if (th) go(th.back); else go('city', ui); };

        b.onclick = function () {

          wrong++; b.classList.add('wrong'); setTimeout(function () { sel = null; paint(); }, 450);

    function finish() {

      G = { cfg: { title: title, unit: th ? null : ui, rerun: th ? th.rerun : function () { runMatch(list, ui); } }, i: 1, qs: [1], right: pick.length, wrong: wrong, xp: xp, best: pick.length, results: [], learned: th ? [] : pick.slice(0, 3).map(function (x) { return x.w; }), ended: false };

  }

  function startDuel(ps) {

  /* ---------- Dla Polaków: Bereich für Muttersprachler (komplett Polnisch), eigene Einstufung in 3 Stufen ---------- */
  var PCATS = ['ortografia', 'poprawnosc', 'aspekt', 'liczebniki', 'frazeologia', 'wiedza'], polLv = 0;

  function polPool(cat, lv) { var out = []; (cat ? [cat] : PCATS).forEach(function (c) { (D.polacy[c] || []).forEach(function (x) { if (!lv || x.lv === lv) out.push(x); }); }); return out; }
  function renderPolacy() {

  }

  /* ---------- Gegenüber: 2 Leute, 1 Handy, geteilter Bildschirm (obere Hälfte 180° gedreht) ----------
     Beide sehen in jeder Runde DIESELBE Frage-Instanz (gleiche Antwortreihenfolge). Erster richtiger Tipp = Punkt. */
  var faceNames = ['Ola', 'Tomek'], faceN = 10;
  function renderFaceSetup() {
    shell('<button class="btn ghost" id="back" style="justify-self:start;padding-left:0">← ' + esc(t('back')) + '</button><h1>' + esc(t('face')) + '</h1>' +
      '<section class="card stack"><p class="small">' + esc(t('face_rules')) + '</p>' +
      '<b>' + esc(t('players')) + '</b>' + [0, 1].map(function (i) { return '<input type="text" id="f' + i + '" value="' + esc(faceNames[i]) + '" aria-label="' + esc(t('players')) + ' ' + (i + 1) + '">'; }).join('') +
      '<b>' + esc(t('face_n')) + '</b><div class="seg" id="fn">' + [5, 10, 15].map(function (n) { return segBtn(String(n), String(n), faceN === n); }).join('') + '</div>' +
      '<button class="btn primary" id="fgo">' + esc(t('start')) + '</button></section>');
    document.getElementById('back').onclick = function () { go('practice'); };
    bindSeg('fn', function (v) { faceN = +v; document.querySelectorAll('#fn button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v)); }); });
    document.getElementById('fgo').onclick = function () {
      faceNames = [0, 1].map(function (i) { return document.getElementById('f' + i).value.trim() || ['Ola', 'Tomek'][i]; });
      startFace();
    };
  }
  function faceQs(n) {
    var pool = poolOpen(), words = C.shuffle(pool, R), cs = C.shuffle(D.cases, R), tf = C.shuffle(D.culture.tf, R), qs = [];
    for (var i = 0; i < n; i++) {
      var k = i % 4, q;
      if (k === 0) q = qMC(words[i % words.length], pool, 'pl2x');
      else if (k === 1) q = qMC(words[i % words.length], pool, 'x2pl');
      else if (k === 2) { var c = cs[i % cs.length]; q = { ask: t('case_q') + ' (' + c.base + ')', big: c.s, sub: L(c.tr), a: c.a, opts: C.shuffle(c.opts.slice(), R), plOpts: true, small: true, sayAfter: c.s.replace('___', c.a) }; }
      else q = qTF(tf[i % tf.length]);
      if (q.opts.length > 4) q.opts = C.shuffle(q.opts.filter(function (o) { return o !== q.a; }).slice(0, 3).concat([q.a]), R);
      qs.push(q);
    }
    return qs;
  }
  function startFace() {
    G = null;
    var F = { qs: faceQs(faceN), i: 0, sc: [0, 0], out: [false, false], done: false, tId: null };
    function half(p, inner) { return '<div class="fhalf' + (p === 0 ? ' flip' : '') + '" data-p="' + p + '">' + inner + '</div>'; }
    function quit() { if (F) clearTimeout(F.tId); F = null; document.removeEventListener('keydown', onKey); go('practice'); }
    function onKey(e) { if (e.key === 'Escape' && F) quit(); }
    document.addEventListener('keydown', onKey);
    function paint() {
      var q = F.qs[F.i], plo = q.plOpts ? ' lang="pl"' : '', plb = q.plOpts || q.ask === t('tf') ? '' : ' lang="pl"';
      var body = function (p) {
        return '<div class="fhead"><b>' + esc(faceNames[p]) + '</b><span class="num fsc">' + F.sc[p] + '</span></div>' +
          '<div class="fask">' + esc(q.ask) + '</div>' +
          '<div class="fbig' + (q.small || String(q.big).length > 34 ? ' sm' : '') + '"' + plb + '>' + esc(q.big) + '</div>' +
          (q.sub ? '<div class="small muted">' + esc(q.sub) + '</div>' : '') +
          '<div class="fopts">' + q.opts.map(function (o, j) { return '<button class="opt" data-o="' + j + '"' + plo + '>' + esc(o) + '</button>'; }).join('') + '</div>' +
          '<div class="fmsg" role="status"></div>';
      };
      $app.innerHTML = '<div class="face">' + half(0, body(0)) +
        '<div class="fbar"><span class="num">' + (F.i + 1) + '/' + F.qs.length + '</span><button class="btn ghost" id="fquit">' + esc(t('face_quit')) + '</button></div>' +
        half(1, body(1)) + '</div>';
      document.getElementById('fquit').onclick = quit;
      $app.querySelectorAll('.fhalf').forEach(function (h) {
        var p = +h.getAttribute('data-p');
        h.querySelectorAll('[data-o]').forEach(function (b) {
          var fire = function (e) { if (e.type === 'pointerdown') e.preventDefault(); answer(p, +b.getAttribute('data-o')); };
          b.addEventListener('pointerdown', fire); b.addEventListener('click', fire);
        });
      });
    }
    function msg(p, txt) { $app.querySelector('.fhalf[data-p="' + p + '"] .fmsg').textContent = txt; }
    function reveal() {
      var q = F.qs[F.i];
      $app.querySelectorAll('.fhalf').forEach(function (h) {
        h.querySelectorAll('[data-o]').forEach(function (b) { b.disabled = true; if (q.opts[+b.getAttribute('data-o')] === q.a) b.classList.add('right'); });
        h.querySelector('.fsc').textContent = F.sc[+h.getAttribute('data-p')];
      });
      if (q.sayAfter || q.say) speak(q.sayAfter || q.say);
      F.tId = setTimeout(function () { if (!F) return; F.i++; F.out = [false, false]; F.done = false; if (F.i >= F.qs.length) end(); else paint(); }, 1800);
    }
    function answer(p, j) {
      if (!F || F.done || F.out[p]) return;
      var q = F.qs[F.i], h = $app.querySelector('.fhalf[data-p="' + p + '"]');
      if (q.opts[j] === q.a) {
        F.done = true; F.sc[p]++; msg(p, t('face_point')); msg(1 - p, faceNames[p] + ' ' + t('face_fast'));
        try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
        reveal();
      } else {
        F.out[p] = true; h.querySelector('[data-o="' + j + '"]').classList.add('wrong');
        h.querySelectorAll('[data-o]').forEach(function (b) { b.disabled = true; });
        msg(p, t('face_wrong'));
        if (F.out[0] && F.out[1]) { F.done = true; msg(0, t('face_nobody')); msg(1, t('face_nobody')); reveal(); }
      }
    }
    function end() {
      document.removeEventListener('keydown', onKey);
      var tie = F.sc[0] === F.sc[1];
      var body = function (p) {
        return '<div class="fend"><h2>' + esc(tie ? t('tie') : F.sc[p] > F.sc[1 - p] ? t('face_win') : t('face_lose')) + '</h2>' +
          '<div class="fscore num">' + F.sc[p] + ' : ' + F.sc[1 - p] + '</div><div class="small muted">' + esc(faceNames[p]) + ' – ' + esc(faceNames[1 - p]) + '</div></div>';
      };
      $app.innerHTML = '<div class="face">' + half(0, body(0)) +
        '<div class="fbar"><button class="btn primary" id="fagain">' + esc(t('again')) + '</button><button class="btn ghost" id="fquit">' + esc(t('face_quit')) + '</button></div>' +
        half(1, body(1)) + '</div>';
      document.getElementById('fagain').onclick = function () { startFace(); };
      document.getElementById('fquit').onclick = function () { F = null; go('practice'); };
      document.getElementById('fagain').focus();
    }
    paint();
  }

  /* ---------- Państwa-Miasta (Stadt-Land-Fluss) ---------- */
  var PM = null;
  function startPM(ps) {
    pmStop();
    PM = { ps: ps, cats: C.shuffle(D.pm.cats, R).slice(0, 5), letters: C.shuffle(D.pm.letters, R).slice(0, 3), round: 0, pi: 0, ans: null, ok: null, tot: ps.map(function () { return 0; }), tId: null };
    pmRound();
  }
  function pmStop() { if (PM && PM.tId) { clearInterval(PM.tId); PM.tId = null; } }
  function pmQuit() { pmStop(); PM = null; go('practice'); }
  function pmTop(extra) {
    return '<div class="game-top"><button class="icon-btn" id="quit" aria-label="' + esc(t('back')) + '">' + I.x + '</button><div class="bar"><i style="width:' + (PM.round / PM.letters.length * 100) + '%"></i></div>' + (extra || '') + '</div>';
  }
  function pmRound() {
    PM.pi = 0;
    PM.ans = PM.ps.map(function () { return PM.cats.map(function () { return ''; }); });
    PM.ok = PM.ps.map(function () { return PM.cats.map(function () { return false; }); });

  }
  function pmPass() {
    view = 'game';
    shell('<section class="game">' + pmTop() + '<div class="prompt"><span class="eyebrow"><span lang="pl">' + esc(t('pm')) + '</span> · ' + esc(t('pm_round')) + ' ' + (PM.round + 1) + '/' + PM.letters.length + '</span>' +

  }
  function pmPlay() {
    var letter = PM.letters[PM.round], secs = { easy: 90, medium: 60, hard: 45 }[S.diff] || 60, left = secs, done = false;
    shell('<section class="game">' + pmTop('<span class="timer num" id="pmt">' + left + '</span>') +
      '<div class="prompt"><span class="eyebrow">' + esc(PM.ps[PM.pi]) + ' · ' + esc(t('pm_letter')) + '</span><div class="pm-letter" lang="pl">' + esc(letter) + '</div></div>' +
      '<form id="pmf" class="stack" autocomplete="off">' + PM.cats.map(function (c, ci) {
        return '<label class="stack" style="gap:4px"><span class="small"><b lang="pl">' + esc(c.pl) + '</b> <span class="muted">· ' + esc(L([c.de, c.en])) + '</span></span>' +
          '<input type="text" id="pm' + ci + '" lang="pl" autocapitalize="off" spellcheck="false" placeholder="' + esc(letter) + '…"></label>';
      }).join('') + '<button class="btn primary block" type="submit">' + esc(t('pm_done')) + '</button></form></section>', false);
    document.getElementById('quit').onclick = pmQuit;
    function fin() {
      if (done || !PM) return; done = true; pmStop();
      PM.ans[PM.pi] = PM.cats.map(function (c, ci) { var el = document.getElementById('pm' + ci); return el ? el.value.trim() : ''; });
      PM.pi++;
      if (PM.pi < PM.ps.length) pmPass(); else pmReview();
    }
    document.getElementById('pmf').onsubmit = function (e) { e.preventDefault(); fin(); };
    document.getElementById('pm0').focus();
    pmStop();
    PM.tId = setInterval(function () { left--; var el = document.getElementById('pmt'); if (el) el.textContent = Math.max(left, 0); if (left <= 0) fin(); }, 1000);
  }
  function pmReview() {
    var letter = PM.letters[PM.round];
    PM.ans.forEach(function (row, pi) { row.forEach(function (a, ci) { PM.ok[pi][ci] = C.pmKnown(a, letter, PM.cats[ci].words); }); });
    var ex = PM.cats.map(function (c) { return C.shuffle(c.words.filter(function (w) { return C.pmLetterOk(w, letter); }), R).slice(0, 3); });
    function paint() {
      var html = '<section class="game">' + pmTop() + '<div class="prompt"><span class="eyebrow">' + esc(t('pm_check')) + ' · ' + esc(t('pm_letter')) + '</span><div class="pm-letter" lang="pl">' + esc(letter) + '</div></div>';
      PM.cats.forEach(function (c, ci) {
        html += '<div class="card stack"><b><span lang="pl">' + esc(c.pl) + '</span> <span class="muted small">· ' + esc(L([c.de, c.en])) + '</span></b>' +
          PM.ps.map(function (p, pi) {
            var a = PM.ans[pi][ci], ok = PM.ok[pi][ci], canTg = a && C.pmLetterOk(a, letter);
            return '<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="grow"><span class="small muted">' + esc(p) + '</span><br><b lang="pl">' + (a ? esc(a) : '–') + '</b></span>' +
              (canTg ? '<button class="chip pm-tg' + (ok ? ' on' : '') + '" data-p="' + pi + '" data-c="' + ci + '" aria-pressed="' + ok + '">' + esc(ok ? t('pm_valid') : t('pm_invalid')) + '</button>'
                : '<span class="chip">' + esc(t('pm_invalid')) + '</span>') + '</div>';
          }).join('') +
          (ex[ci].length ? '<span class="small muted">' + esc(t('pm_examples')) + ': <span lang="pl">' + esc(ex[ci].join(', ')) + '</span></span>' : '') + '</div>';
      });
      html += '<button class="btn primary block" id="pmc">' + esc(t('pm_count')) + '</button></section>';
      shell(html, false);
      document.getElementById('quit').onclick = pmQuit;
      document.querySelectorAll('.pm-tg').forEach(function (b) {
        b.onclick = function () { var pi = +b.getAttribute('data-p'), ci = +b.getAttribute('data-c'), y = window.scrollY; PM.ok[pi][ci] = !PM.ok[pi][ci]; paint(); window.scrollTo(0, y); };
      });
      document.getElementById('pmc').onclick = pmScoreRound;
    }
    paint(); window.scrollTo(0, 0);
  }
  function pmScoreRound() {
    var pts = PM.ps.map(function () { return 0; });
    PM.cats.forEach(function (c, ci) {
      C.pmScore(PM.ps.map(function (p, pi) { return PM.ans[pi][ci]; }), PM.ps.map(function (p, pi) { return PM.ok[pi][ci]; }))
        .forEach(function (v, pi) { pts[pi] += v; });
    });
    pts.forEach(function (v, pi) { PM.tot[pi] += v; });
    PM.round++;
    var last = PM.round >= PM.letters.length, max = Math.max.apply(null, PM.tot), win = PM.ps.filter(function (p, i) { return PM.tot[i] === max; });
    var rows = PM.ps.map(function (p, i) { return '<div class="row" style="justify-content:space-between"><b>' + esc(p) + '</b><span class="num">+' + pts[i] + ' · <b>' + PM.tot[i] + '</b></span></div>'; }).join('');
    shell('<section class="result pop"><span class="eyebrow" lang="pl">' + esc(t('pm')) + '</span><h1>' + esc(last ? t('done') : t('pm_round') + ' ' + PM.round + '/' + PM.letters.length) + '</h1>' +
      '<div class="card stack" style="width:100%;text-align:left"><span class="eyebrow">' + esc(t('pm_total')) + '</span>' + rows + '</div>' +
      (last ? '<h2>' + esc(win.length > 1 ? t('tie') : win[0] + ' ' + t('winner')) + '</h2><div class="row" style="width:100%"><button class="btn" id="again" style="flex:1">' + esc(t('again')) + '</button><button class="btn primary" id="home" style="flex:1">' + esc(t('home')) + '</button></div>'
        : '<button class="btn primary block" id="pmn">' + esc(t('pm_next_round')) + '</button>') + '</section>', false);
    if (last) {
      var ps = PM.ps; markActive(); save();
      document.getElementById('again').onclick = function () { startPM(ps); };
      document.getElementById('home').onclick = function () { PM = null; go('home'); };
    } else document.getElementById('pmn').onclick = pmRound;
  }

  /* ---------- Start ---------- */
  /* ================================================================
     Prüfmodus für Muttersprachler (3.0): polski.arndt-software.de/?review
     Alle polnischen Inhalte nacheinander: ✓ poprawne / ✗ do poprawy (+ Vorschlag). Ergebnisse gehen in ps_feedback,
     ✓ gesammelt in Paketen, ✗ sofort. Fortschritt bleibt im Browser (localStorage polski_szlak_review).
     ================================================================ */
  var REVIEW = /[?&]review\b/.test(location.search), RVK = 'polski_szlak_review', RV = null, rvSec = 'new', rvCur = null, rvBad = false;
  var RVX = { title: 'Sprawdzanie treści', intro: 'Dziękujemy za pomoc! Sprawdź, czy polskie zdania są poprawne i naturalne, a tłumaczenia pasują. Formy w nawiasach {…|…} pokazujemy jako wersję męską i żeńską.', name: 'Twoje imię (opcjonalnie)', all: 'Wszystko', newer: 'Najpierw: Szlak 2, 3 i pakiety', ok: '✓ Poprawne', bad: '✗ Do poprawy', skip: 'Pomiń', how: 'Jak powinno być? Co jest nie tak?', send: 'Wyślij uwagę', done: 'Gotowe! Wszystko w tej części sprawdzone.', prog: 'sprawdzone', sent: 'Wysłano', pend: 'czeka na wysłanie', flush: 'Wyślij teraz', export: 'Wyniki jako tekst (kopia zapasowa)', copy: 'Kopiuj', fail: 'Brak połączenia – wyniki są zapisane i zostaną wysłane później.', back: 'Do aplikacji', listen: 'Odsłuchaj', undo: 'Cofnij ostatnie',
    secs: { rd: 'Książka (Szlak 3)', w: 'Słówka', s: 'Zdania', sc: 'Scenki', l: 'List i pocztówki', m: 'Misje', c: 'Przypadki', a: 'Aspekt', v: 'Czasowniki', t: 'Łamańce językowe', k: 'Krasnale', p: 'Dla Polaków' } };
  function rvLoad() { try { RV = JSON.parse(localStorage.getItem(RVK) || 'null'); } catch (e) {} if (!RV || typeof RV !== 'object') RV = { name: '', res: {}, pend: [], hist: [] }; RV.res = RV.res || {}; RV.pend = RV.pend || []; RV.hist = RV.hist || []; }
  function rvSave() { try { localStorage.setItem(RVK, JSON.stringify(RV)); } catch (e) {} }
  function rvShow(s) { return C.hasG(s) ? C.gform(s, 'm') + '  ·  ' + C.gform(s, 'f') : String(s); }
  function rvItems() {
    var it = [], R0 = RAW;
    function add(k, sec, pl, de, en, note) { it.push({ k: k, sec: sec, pl: rvShow(pl), de: de ? rvShow(de) : '', en: en ? rvShow(en) : '', note: note || '', r: rvR }); }
    var rvR = 1;
    R0.units.forEach(function (u) { rvR = u.pack ? 2 : (u.r || 1);
      u.words.forEach(function (w, i) { add('w:' + u.id + ':' + i, 'w', w[0], w[1], w[2], u.city); });
      u.sentences.forEach(function (s, i) { add('s:' + u.id + ':' + i, 's', s[0], s[1], s[2], u.city); });
      if (u.read) {
        u.read.lines.forEach(function (l, i) { add('r:' + u.id + ':' + i, 'rd', l.pl, l.tr[0], l.tr[1], u.city + ' · ' + L(u.read.t)); });
        u.read.q.forEach(function (q, i) { add('rq:' + u.id + ':' + i, 'rd', q.q + '  →  ' + q.o.join(' / '), q.tr[0], q.tr[1], u.city + ' · ✓ ' + q.o[q.a]); });
      }
      if (u.scene) u.scene.steps.forEach(function (st, si) {
        add('sc:' + u.id + ':' + si + ':n', 'sc', st.npc[0], st.npc[1], st.npc[2], u.city + ' · NPC');
        st.opts.forEach(function (o, oi) { add('sc:' + u.id + ':' + si + ':' + oi, 'sc', o[0], o[1], o[2], u.city + (o[3] ? ' · ✓' : ' · (zła odpowiedź – ma być poprawna polszczyzna, ale nie pasuje do sytuacji)')); });
      });
    });
    rvR = 1;
    [['l', R0.letter], ['d', R0.diary]].forEach(function (x) { rvR = x[0] === 'd' ? 2 : 1; if (x[1]) x[1].lines.forEach(function (l, i) { add(x[0] + ':' + i, 'l', l.pl, l.tr[0], l.tr[1]); }); });
    rvR = 2;
    Object.keys(R0.missions || {}).forEach(function (k) { add('m:' + k, 'm', R0.missions[k].pl, R0.missions[k].d[0], R0.missions[k].d[1]); });
    rvR = 1;
    (R0.cases || []).forEach(function (c, i) { add('c:' + i, 'c', c.s.replace('___', c.a), c.tr[0], c.tr[1], c.base + ' → ' + c.a + ' · ' + c.case[0]); });
    (R0.aspects || []).forEach(function (c, i) { add('a:' + i, 'a', c.s.replace('___', c.a), c.tr[0], c.tr[1], c.base + ' → ' + c.a); });
    (R0.verbs || []).forEach(function (v) { add('v:' + v.inf, 'v', v.inf + ': ' + v.pres.join(', ') + ' | ' + v.past.join(', '), v.de, v.en); });
    (R0.twisters || []).forEach(function (x, i) { add('t:' + i, 't', x[0], x[1], x[2]); });
    (R0.krasnale || []).forEach(function (x, i) { add('k:' + i, 'k', x[0] + ' – ' + x[1], x[2], x[3]); });
    Object.keys(R0.polacy || {}).forEach(function (c) { R0.polacy[c].forEach(function (x, i) { add('p:' + c + ':' + i, 'p', (x.s ? x.s.replace('___', x.a) + '  —  ' : '') + x.q + ' → ' + x.a, '', '', 'Źle: ' + x.o.join(' / ') + (x.x ? ' · ' + x.x : '')); }); });
    return it;
  }
  function rvSend(msg, ctx) { return sbFetch('/rest/v1/ps_feedback', { method: 'POST', prefer: 'return=minimal', body: { msg: String(msg).slice(0, 1000), ctx: String(ctx).slice(0, 500), lang: S.base === 'en' ? 'en' : 'de', ver: APP_VER } }); } /* Tabelle erlaubt nur de/en; „review“ steht im ctx */
  function rvFlush() {
    if (!RV.pend.length) return Promise.resolve();
    var batch = RV.pend.slice(0, 60);
    return rvSend('REVIEW ✓ ' + batch.length + ': ' + batch.join(' '), 'review|' + (RV.name || '?')).then(function () { RV.pend = RV.pend.slice(batch.length); rvSave(); return rvFlush(); });
  }
  function renderReview() {
    if (!RV) rvLoad();
    var all = rvItems(), secs = {}, list = all.filter(function (x) { secs[x.sec] = secs[x.sec] || { n: 0, d: 0 }; secs[x.sec].n++; if (RV.res[x.k]) secs[x.sec].d++; return rvSec === 'all' || x.sec === rvSec || (rvSec === 'new' && x.r >= 2); });
    var done = list.filter(function (x) { return RV.res[x.k]; }).length;
    if (!rvCur || !list.some(function (x) { return x.k === rvCur; }) || RV.res[rvCur]) { var nx = list.filter(function (x) { return !RV.res[x.k]; })[0]; rvCur = nx ? nx.k : null; rvBad = false; }
    var cur = list.filter(function (x) { return x.k === rvCur; })[0];
    var tot = all.filter(function (x) { return RV.res[x.k]; }).length;
    var html = '<section class="stack" lang="pl"><h1>' + esc(RVX.title) + '</h1><p class="small">' + esc(RVX.intro) + '</p>' +
      '<label class="fld">' + esc(RVX.name) + '<input type="text" id="rv-name" maxlength="30" autocomplete="name" value="' + esc(RV.name) + '"></label>' +
      '<div class="seg rv-secs" id="rv-sec">' + segBtn('new', RVX.newer + ' ' + all.filter(function (x) { return x.r >= 2 && RV.res[x.k]; }).length + '/' + all.filter(function (x) { return x.r >= 2; }).length, rvSec === 'new') + segBtn('all', RVX.all + ' ' + tot + '/' + all.length, rvSec === 'all') + Object.keys(secs).map(function (k) { return segBtn(k, RVX.secs[k] + ' ' + secs[k].d + '/' + secs[k].n, rvSec === k); }).join('') + '</div>' +
      '<div class="row small muted num"><div class="bar" style="flex:1"><i style="width:' + (list.length ? done / list.length * 100 : 0) + '%"></i></div>' + done + '/' + list.length + ' ' + esc(RVX.prog) + '</div>';
    if (cur) {
      html += '<article class="card stack rv-card"><span class="eyebrow">' + esc(RVX.secs[cur.sec]) + (cur.note ? ' · ' + esc(cur.note) : '') + ' · <span class="num">' + esc(cur.k) + '</span></span>' +
        '<div class="row" style="align-items:start;flex-wrap:nowrap"><p class="rv-pl grow">' + esc(cur.pl) + '</p><button class="icon-btn" id="rv-say" aria-label="' + esc(RVX.listen) + '">' + I.spk + '</button></div>' +
        (cur.de ? '<p class="small" lang="de">DE: ' + esc(cur.de) + '</p>' : '') + (cur.en ? '<p class="small" lang="en">EN: ' + esc(cur.en) + '</p>' : '') +
        (rvBad ? '<label class="fld">' + esc(RVX.how) + '<textarea id="rv-txt" rows="3" maxlength="800"></textarea></label><div class="row"><button class="btn primary" id="rv-send">' + esc(RVX.send) + '</button><button class="btn ghost" id="rv-cancel">' + esc(RVX.skip) + '</button></div>'
          : '<div class="row"><button class="btn primary" id="rv-ok" style="flex:1">' + esc(RVX.ok) + '</button><button class="btn" id="rv-bad" style="flex:1">' + esc(RVX.bad) + '</button></div><button class="btn ghost" id="rv-skip" style="justify-self:start">' + esc(RVX.skip) + ' →</button>') +
        '<p class="small muted" id="rv-st" role="status"></p></article>';
    } else html += '<div class="banner pop"><strong>' + esc(RVX.done) + '</strong></div>';
    html += '<div class="row">' + (RV.hist.length ? '<button class="btn ghost" id="rv-undo">↶ ' + esc(RVX.undo) + '</button>' : '') + (RV.pend.length ? '<button class="btn" id="rv-flush">' + esc(RVX.flush) + ' (' + RV.pend.length + ' ' + esc(RVX.pend) + ')</button>' : '') + '</div>' +
      '<details class="card"><summary class="small" style="cursor:pointer;font-weight:700">' + esc(RVX.export) + '</summary><textarea id="rv-exp" rows="6" style="width:100%;margin-top:8px">' + esc(Object.keys(RV.res).map(function (k) { return k + ' ' + RV.res[k]; }).join('\n')) + '</textarea><button class="btn" id="rv-copy">' + esc(RVX.copy) + '</button></details>' +
      '<a class="btn ghost" href="./" style="justify-self:start">← ' + esc(RVX.back) + '</a></section>';
    shell(html, false);
    var st = function (m) { var e = document.getElementById('rv-st'); if (e) e.textContent = m; };
    document.getElementById('rv-name').onchange = function (e) { RV.name = e.target.value.trim().slice(0, 30); rvSave(); };
    bindSeg('rv-sec', function (v) { rvSec = v; rvCur = null; renderReview(); });
    var b;
    if ((b = document.getElementById('rv-say'))) b.onclick = function () { ttsSpeak(C.gform(cur.pl.split('  ·  ')[0].split(' → ')[0], 'm')); };
    if ((b = document.getElementById('rv-ok'))) b.onclick = function () { RV.res[cur.k] = 'ok'; RV.pend.push(cur.k); RV.hist.push(cur.k); rvSave(); if (RV.pend.length >= 20) rvFlush().catch(function () {}); renderReview(); };
    if ((b = document.getElementById('rv-bad'))) b.onclick = function () { rvBad = true; renderReview(); setTimeout(function () { var t2 = document.getElementById('rv-txt'); if (t2) t2.focus(); }, 30); };
    if ((b = document.getElementById('rv-skip'))) b.onclick = function () { var idx = list.indexOf(cur), nx = list.slice(idx + 1).concat(list.slice(0, idx)).filter(function (x) { return !RV.res[x.k]; })[0]; rvCur = nx ? nx.k : null; renderReview(); };
    if ((b = document.getElementById('rv-cancel'))) b.onclick = function () { rvBad = false; renderReview(); };
    if ((b = document.getElementById('rv-send'))) b.onclick = function () {
      var txt = document.getElementById('rv-txt').value.trim(), item = cur; if (!txt) return;
      b.disabled = true; st('…');
      RV.res[item.k] = 'bad: ' + txt.replace(/\s+/g, ' '); RV.hist.push(item.k); rvSave();
      rvSend('REVIEW ✗ [' + item.k + '] ' + item.pl + ' → ' + txt, 'review|' + (RV.name || '?') + '|' + item.k).then(function () { toast(RVX.sent); rvBad = false; renderReview(); },
        function () { copy('[' + item.k + '] ' + item.pl + ' → ' + txt); toast(RVX.fail); rvBad = false; renderReview(); });
    };
    if ((b = document.getElementById('rv-undo'))) b.onclick = function () { var k = RV.hist.pop(); if (k) { delete RV.res[k]; RV.pend = RV.pend.filter(function (x) { return x !== k; }); rvCur = k; rvBad = false; } rvSave(); renderReview(); };
    if ((b = document.getElementById('rv-flush'))) b.onclick = function () { b.disabled = true; rvFlush().then(function () { toast(RVX.sent); renderReview(); }, function () { toast(RVX.fail); renderReview(); }); };
    if ((b = document.getElementById('rv-copy'))) b.onclick = function () { copy(document.getElementById('rv-exp').value); };
  }
  if (REVIEW) document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && RV && RV.pend.length) rvFlush().catch(function () {}); });

  function boot() {
    if (REVIEW) { needS3(function () { renderReview(); }); renderReview(); if (!RAW.polacy && RAW.polacyLazy) needPolacy(function () { renderReview(); }); return; }
    startSafety(); sbFromHash(); if (S.vsrc) needAV();
    /* Erst zeichnen, wenn Szlak 2/3 da sind (aus dem Cache: Millisekunden) – spätestens nach 1,2 s; kommt es später, Startseite neu zeichnen */
    var first = false;
    function go1() { if (first) return; first = true; render(); setTimeout(installHint, 1200); if (A && A.uid) syncNow(); }
    needS3(function () { if (first) { if (!G && tab === 'home') render(); } else go1(); });
    setTimeout(go1, 1200);
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();

  /* Service Worker nur im eigenen Hosting (nicht in Vorschauen/iframes) */
  try { if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self && document.documentElement.getAttribute('data-pwa') === '1') navigator.serviceWorker.register('sw.js'); } catch (e) {}

  window.PSApp = { state: function () { return S; }, startMode: startMode, go: go, game: function () { return G; }, data: function () { return D; } };
})();
