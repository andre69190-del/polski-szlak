/* Layout: App-Shell, eine Spalte (max 720px), Kopfzeile sticky, Navigation unten fixiert.
   Motiv: polnische Wandermarkierung (PTTK-Szlak) = weiß-farbig-weiß Streifen. */
:root {
  --bg: #eef1f3; --surface: #ffffff; --surface-2: #f6f8f9; --ink: #14212b; --muted: #546572; --line: #d3dce2;
  --red: #c4122f; --on-red: #ffffff; --amber: #9a5b00; --amber-soft: #fbeacb;
  --good: #1b7343; --good-soft: #dcf1e4; --bad: #a8231c; --bad-soft: #f9e0dd;
  --map-land: #dfe7ec; --map-edge: #98abb8; --route: #7b8d99;
  --t-red: #d02a2a; --t-blue: #1f5fbf; --t-green: #1f8a4c; --t-yellow: #d9a800; --t-black: #22272b; --blaze-white: #ffffff;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151a; --surface: #18222a; --surface-2: #1d2932; --ink: #e7eef3; --muted: #9fb0bc; --line: #2b3a46;
  --red: #ff6274; --on-red: #1a0b0e; --amber: #f2ad45; --amber-soft: #3a2b12;
  --good: #57c98a; --good-soft: #163426; --bad: #ff8a7f; --bad-soft: #3e1e1b;
  --map-land: #1f2b34; --map-edge: #3d515f; --route: #6c8291;
  --t-red: #ff6b6b; --t-blue: #6a9dff; --t-green: #4fc283; --t-yellow: #f1c53a; --t-black: #dfe6eb; --blaze-white: #2a3843;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151a; --surface: #18222a; --surface-2: #1d2932; --ink: #e7eef3; --muted: #9fb0bc; --line: #2b3a46;
  --red: #ff6274; --on-red: #1a0b0e; --amber: #f2ad45; --amber-soft: #3a2b12;
  --good: #57c98a; --good-soft: #163426; --bad: #ff8a7f; --bad-soft: #3e1e1b;
  --map-land: #1f2b34; --map-edge: #3d515f; --route: #6c8291;
  --t-red: #ff6b6b; --t-blue: #6a9dff; --t-green: #4fc283; --t-yellow: #f1c53a; --t-black: #dfe6eb; --blaze-white: #2a3843;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Shell */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; margin-right: auto;
  background: none; border: 0; padding: 4px 0; color: inherit; cursor: pointer; min-height: 44px; }
.brand:hover { color: var(--red); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: .85rem; font-weight: 700; }
.chip.amber { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
main { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); } /* PATCH003 */
button.chip { cursor: pointer; min-height: 40px; } /* PATCH004 */
.clues { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 1.05rem; }
.clues li::marker { color: var(--red); font-weight: 700; }
.nav button { background: none; border: 0; padding: 10px 4px 12px; display: grid; justify-items: center; gap: 2px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--red); }

/* Wandermarkierung (PTTK): weiß – Farbe – weiß */
.blaze { display: inline-grid; grid-template-rows: 1fr 1.3fr 1fr; width: 22px; height: 16px; border-radius: 2px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px var(--line); }
.blaze i { display: block; background: var(--blaze-white); }
.blaze i:nth-child(2) { background: var(--c, var(--t-red)); }
.tr-red { --c: var(--t-red); } .tr-blue { --c: var(--t-blue); } .tr-green { --c: var(--t-green); } .tr-yellow { --c: var(--t-yellow); } .tr-black { --c: var(--t-black); }

/* Flächen */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sep { height: 1px; background: var(--line); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-sm); padding: 12px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); min-height: 48px; text-align: center; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--red); color: var(--on-red); border-color: var(--red); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }

/* Startseite */
.hero { display: grid; gap: 12px; }
.hero-top { display: flex; gap: 16px; align-items: center; }
.ring { width: 92px; height: 92px; flex: none; }
.ring text { font-family: var(--f-display); font-weight: 800; fill: var(--ink); }
.map-wrap { position: relative; }
.map { width: 100%; height: auto; display: block; }
.map .land { fill: var(--map-land); stroke: var(--map-edge); stroke-width: 2; stroke-linejoin: round; }
.map .route { fill: none; stroke: var(--route); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
.map .route-done { fill: none; stroke: var(--red); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.map .node { cursor: pointer; }
.map .node circle.dot { fill: var(--surface); stroke: var(--map-edge); stroke-width: 3; }
.map .node.open circle.dot { stroke: var(--red); }
.map .node.done circle.dot { fill: var(--red); stroke: var(--red); }
.map .node.next circle.halo { fill: var(--red); opacity: .18; }
.map .node text { font-family: var(--f-display); font-weight: 700; font-size: 22px; fill: var(--ink); paint-order: stroke; stroke: var(--map-land); stroke-width: 6px; }
.map .node.locked text { fill: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .map .node.next circle.halo { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } }
@keyframes pulse { 0%,100% { transform: scale(.8); opacity: .25; } 50% { transform: scale(1.25); opacity: .08; } }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; min-height: 92px; align-content: start; }
.tile:hover { background: var(--surface-2); }
.tile .t { font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; }
.tile .d { font-size: .85rem; color: var(--muted); }
.tile .badge { justify-self: start; margin-top: 4px; }
.badge { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.next { background: var(--red); color: var(--on-red); }
.next-box { border-left: 4px solid var(--red); }
.welcome { border-left: 4px solid var(--amber); }

.bar { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); border-radius: 999px; }
.bar.amber > i { background: var(--amber); }
.bar.muted > i { background: var(--route); }

.banner { border-radius: var(--r); padding: 14px 16px; background: var(--amber-soft); color: var(--ink); display: grid; gap: 4px; border: 1px solid transparent; }
.banner strong { font-family: var(--f-display); }

/* Stadt */
.city-head { display: grid; gap: 8px; }
.city-head .pl { font-family: var(--f-display); font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.tip { border-left: 4px solid var(--amber); background: var(--surface); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 12px 14px; }
.list { display: grid; gap: 0; }
.list .li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list .li:last-child { border-bottom: 0; }
.list .li .grow { flex: 1; min-width: 0; }
.wdiff { display: block; font-size: 1.1rem; margin: 6px 0; line-height: 1.7; }
.wd.ok { color: var(--good); }
.wd.no { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; font-weight: 700; }
.rv-pl { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; margin: 0; }
.rv-secs { flex-wrap: wrap; }
.chip[aria-pressed="true"] { background: var(--red); color: var(--on-red); border-color: var(--red); }
.good-t { color: var(--good); }
.conj-tab { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.conj-tab table { border-collapse: collapse; width: 100%; font-size: .95rem; }
.conj-tab th { text-align: left; font-weight: 400; color: var(--muted); padding: 2px 6px 2px 0; white-space: nowrap; }
.conj-tab td { padding: 2px 0; }
.linkish { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; min-height: 32px; }
.linkish:hover { color: var(--red); }
@media (max-width: 380px) { .conj-tab { grid-template-columns: 1fr; } }
.theme-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.theme-ico { font-size: 1.8rem; line-height: 1; }
.theme-lesson { gap: 10px; align-items: center; }
.map-seg { margin: 4px 4px 6px; }
.chat-log { gap: 10px; }
#ch-f textarea, .fld select { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; font: inherit; }
.fld select { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
#ch-f textarea { min-height: 64px; font-family: var(--f-body); font-size: 1rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.chat-fix { margin-top: 6px; }
.chat-fix span { color: var(--good); font-weight: 700; }
.news-ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.news-hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
.vc-out { white-space: pre-wrap; font-size: .78rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; max-height: 320px; overflow: auto; margin: 0; }
.pl-word { font-family: var(--f-display); font-weight: 700; }
.box-dots { display: inline-flex; gap: 3px; }
.box-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.box-dots i.on { background: var(--good); }

/* Spiel */
.game { display: grid; gap: 16px; }
.game-top { display: flex; gap: 12px; align-items: center; }
.game-top .bar { flex: 1; }
.lives { display: inline-flex; gap: 4px; }
.lives i { width: 14px; height: 14px; border-radius: 3px; background: var(--red); }
.lives i.off { background: var(--line); }
.prompt { display: grid; gap: 8px; padding: 8px 0; }
.prompt .big { font-family: var(--f-display); font-size: clamp(1.6rem, 6vw, 2.3rem); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.prompt .sentence { font-family: var(--f-display); font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.prompt .blank { display: inline-block; min-width: 3.5em; border-bottom: 3px solid var(--red); }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 14px 16px; font-size: 1.05rem; font-weight: 700; min-height: 52px; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--route); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.answer-in { width: 100%; font-size: 1.25rem; padding: 14px 16px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--surface); }
.answer-in:focus { border-color: var(--red); outline: none; }
.pl-keys { display: flex; flex-wrap: wrap; gap: 6px; }
.pl-keys button { min-width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.tiles-build { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: var(--r-sm); }
.tiles-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.wtile { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; min-height: 44px; }
.wtile.used { visibility: hidden; }
.feedback { border-radius: var(--r-sm); padding: 14px 16px; display: grid; gap: 6px; }
.feedback.ok { background: var(--good-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback .h { font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.feedback.ok .h { color: var(--good); }
.feedback.no .h { color: var(--bad); }
.combo { font-family: var(--f-display); font-weight: 800; color: var(--amber); }

rem.","Zum Frühstück esse ich Brot mit Käse.","For breakfast I eat bread with cheese."],["Poproszę szklankę wody.","Ein Glas Wasser, bitte.","A glass of water, please."],["Czy jest sok pomarańczowy?","Gibt es Orangensaft?","Is there orange juice?"],["Smacznego! To ciasto jest pyszne.","Guten Appetit! Dieser Kuchen ist köstlich.","Enjoy your meal! This cake is delicious."],["Na kolację jemy pierogi z serem.","Zum Abendessen essen wir Piroggen mit Käse.","For dinner we eat pierogi with cheese."]],"scene":{"intro":["Ein kleines Café an der Hakenterrasse (Wały Chrobrego) mit Blick auf die Oder. Die Kellnerin kommt an deinen Tisch.","A small café on the Chrobry Embankment overlooking the Oder. The waitress comes to your table."],"steps":[{"npc":["Dzień dobry! Co podać?","Guten Tag! Was darf es sein?","Good day! What can I get you?"],"opts":[["Poproszę herbatę.","Ich hätte gern einen Tee.","I'd like a tea.",1],["Poproszę herbata.","Ich hätte gern Tee (falsche Form).","I'd like tea (wrong form).",0],["Jestem herbata.","Ich bin Tee.","I am tea.",0]],"hint":["Nach „poproszę“ wird aus -a ein -ę.","After 'poproszę', -a becomes -ę."]},{"npc":["Z cukrem?","Mit Zucker?","With sugar?"],"opts":[["Nie, bez cukru.","Nein, ohne Zucker.","No, without sugar.",1],["Nie, bez cukier.","Nein, ohne Zucker (falsche Form).","No, without sugar (wrong form).",0]],"hint":["„bez“ (ohne) verlangt den Genitiv: cukru.","'bez' (without) takes the genitive: cukru."]},{"npc":["Proszę bardzo. Smacznego!","Bitte sehr. Guten Appetit!","Here you are. Enjoy!"],"opts":[["Dziękuję!","Danke!","Thank you!",1],["Smacznego, do widzenia, dobranoc!","Guten Appetit, tschüss, gute Nacht!","Enjoy, bye, good night!",0]],"hint":["Ein einfaches Danke reicht.","A simple thank you is enough."]}],"outro":["Der Tee kommt im Glas, wie es in Polen üblich ist. Bestellung erfolgreich.","The tea comes in a glass, as is common in Poland. Order complete."]}},{"id":"gda","city":"Gdańsk","cityDe":"Danzig","cityEn":"Gdańsk","lon":18.65  grandpa live in Gdańsk."]],"scene":{"intro":["Lange Gasse (Długi Targ) in Gdańsk. Dein Gastgeber zeigt dir auf dem Handy Familienfotos.","Long Market (Długi Targ) in Gdańsk. Your host shows you family photos on his phone."],"steps":[{"npc":["To moja rodzina. Masz rodzeństwo?","Das ist meine Familie. Hast du Geschwister?","This is my family. Do you have siblings?"],"opts":[["Tak, mam brata.","Ja, ich habe einen Bruder.","Yes, I have a brother.",1],["Tak, mam brat.","Ja, ich habe Bruder (falsche Form).","Yes, I have brother (wrong form).",0],["Nie, mam kawę.","Nein, ich habe Kaffee.","No, I have coffee.",0]],"hint":["Belebt + männlich → Akkusativ mit -a: brata.","Animate + masculine → accusative with -a: brata."]},{"npc":["A to mój pies, Burek.","Und das ist mein Hund, Burek.","And this is my dog, Burek."],"opts":[["Ja też mam psa!","Ich habe auch einen Hund!","I have a dog too!",1],["Ja też mam pies!","Ich habe auch Hund (falsche Form)!","I have dog too (wrong form)!",0]],"hint":["pies → psa (das e fällt weg).","pies → psa (the e drops out)."]},{"npc":["A ty? Masz dzieci?","Und du? Hast du Kinder?","And you? Do you have children?"],"opts":[["Tak, mam syna i córkę.","Ja, ich habe einen Sohn und eine Tochter.","Yes, I have a son and a daughter.",1],["Nie, nie mam dzieci.","Nein, ich habe keine Kinder.","No, I don't have children.",1],["Tak, mam dziadek.","Ja, ich habe Opa (falsche Form).","Yes, I have grandpa (wrong form).",0]],"hint":["Beide ehrlichen Antworten sind richtig, wenn die Form stimmt.","Either honest answer is fine as long as the form is right."]}],"outro":["Burek bellt einmal, als hätte er dich verstanden. Familiengespräch gemeistert.","Burek barks once, as if he understood. Family chat mastered."]}},{"id":"tor","city":"Toruń","cityDe":"Thorn","cityEn":"Toruń","lon":18.6,"lat":53.01,"trail":"blue","title":["Zeit und Tage","Time and days"],"can":["Ich kann Wochentage nennen, Verabredungen machen und sagen, wie oft ich etwas tue.","I can name the days of t r aus der polnischen Geschichte.","I painted huge pictures of Polish history."],["Mein bekanntestes Bild zeigt die Schlacht bei Grunwald.","My best-known painting shows the Battle of Grunwald."]]},{"name":"Kazimierz Wielki","clues":[["Ich war der letzte König aus der Dynastie der Piasten.","I was the last king of the Piast dynasty."],["1364 gründete ich die Universität in Krakau.","In 1364 I founded the university in Kraków."],["Man sagt, ich fand Polen aus Holz vor und hinterließ es aus Stein.","They say I found Poland made of wood and left it made of stone."]]},{"name":"Bolesław Chrobry","clues":[["Mein Beiname bedeutet „der Tapfere“.","My nickname means 'the Brave'."],["Im Jahr 1000 empfing ich Kaiser Otto III. in Gniezno.","In the year 1000 I received Emperor Otto III in Gniezno."],["1025 wurde ich als erster König Polens gekrönt.","In 1025 I was crowned the first king of Poland."]]},{"name":"Mieszko I","clues":[["Ich gelte als erster historisch belegter Herrscher Polens.","I'm considered the first historically documented ruler of Poland."],["Ich heiratete die böhmische Prinzessin Dobrawa.","I married the Bohemian princess Dobrawa."],["966 ließ ich mich taufen.","In 966 I was baptised."]]},{"name":"Jan III Sobieski","clues":[["Ich war König von Polen und Großfürst von Litauen.","I was King of Poland and Grand Duke of Lithuania."],["Mein Sommerpalast steht in Wilanów bei Warschau.","My summer palace stands in Wilanów near Warsaw."],["1683 befreite ich mit meinen Husaren Wien von der Belagerung.","In 1683 my hussars and I relieved the siege of Vienna."]]},{"name":"Ignacy Jan Paderewski","clues":[["Ich war ein weltberühmter Pianist.","I was a world-famous pianist."],["Ich gab Konzerte in ganz Amerika und sammelte Geld für Polen.","I gave concerts all over America and raised money for Poland."],["1919 wurde ich Ministerpräsident und unterschrieb den Vertrag von Versailles.","In 1919 I became prime minister and signed the Treaty of Versailles."]]},{"name":"Czesław Miłosz","clues":[["Ich war Dichter und Übersetzer.","I was a poet and translator."],["Ich lebte lange in Kalifornien und lehrte in Berkeley.","I lived in California for a long time and taught at Berkeley."],["1980 bekam ich den Literaturnobelpreis.","In 1980 I won the Nobel Prize in Literature."]]},{"name":"Krzysztof Kieślowski","clues":[["Ich war Filmregisseur und studierte in Łódź.","I was a film director and studied in Łódź."],["Ich drehte zehn Filme zu den Zehn Geboten: „Dekalog“.","I made ten films about the Ten Commandments: 'Dekalog'."],["Meine Trilogie heißt „Drei Farben: Blau, Weiß, Rot“.","My trilogy is called 'Three Colours: Blue, White, Red'."]]},{"name":"Iga Świątek","clues":[["Ich wurde 2001 in Warschau geboren.","I was born in Warsaw in 2001."],["Mein Sport wird mit Schläger und Ball gespielt.","My sport is played with a racket and a ball."],["Ich war Weltranglisten-Erste und gewann mehrmals die French Open.","I was world number one and won the French Open several times."]]},{"name":"Adam Małysz","clues":[["Ich komme aus der Stadt Wisła in den Beskiden.","I come from the town of Wisła in the Beskids."],["Man nannte mich den „Adler aus Wisła“.","They called me the 'Eagle of Wisła'."],["Ich wurde viermal Weltmeister im Skispringen.","I became ski jumping world champion four times."]]},{"name":"Kazimierz Funk","clues":[["Ich wurde 1884 in Warschau geboren und war Biochemiker.","I was born in Warsaw in 1884 and was a biochemist."],["Ich forschte über Krankheiten wie Beriberi und Skorbut.","I researched diseases like beriberi and scurvy."],["Ich erfand 1912 das Wort „Vitamin“.","In 1912 I coined the word 'vitamin'."]]},{"name":"Ignacy Łukasiewicz","clues":[["Ich war Apotheker in Lemberg (Lwów).","I was a pharmacist in Lviv (Lwów)."],["Ich gründete eine der ersten Ölquellen der Welt.","I founded one of the world's first oil wells."],["1853 erfand ich die Petroleumlampe.","In 1853 I invented the kerosene lamp."]]},{"name":"Jerzy Kukuczka","clues":[["Ich kam aus Katowice und war Bergsteiger.","I came from Katowice and was a mountaineer."],["Ich stieg oft im Winter oder auf neuen Routen auf.","I often climbed in winter or on new routes."],["Als Zweiter der Welt stand ich auf allen 14 Achttausendern.","I was the second person to climb all 14 eight-thousanders."]]},{"name":"Wanda Rutkiewicz","clues":[["Ich war Bergsteigerin und Elektroingenieurin.","I was a mountaineer and an electrical engineer."],["1978 stand ich als erste Europäerin auf dem Mount Everest.","In 1978 I became the first European woman on Mount Everest."],["1986 war ich die erste Frau auf dem K2.","In 1986 I was the first woman on K2."]]},{"name":"Witold Pilecki","clues":[["Ich war Offizier im polnischen Untergrund.","I was an officer in the Polish underground."],["1940 ließ ich mich freiwillig nach Auschwitz bringen, um darüber zu berichten.","In 1940 I volunteered to be taken to Auschwitz to report on it."],["Meine Berichte gehörten zu den ersten über den Holocaust.","My reports were among the first about the Holocaust."]]},{"name":"Stanisław Moniuszko","clues":[["Ich wurde 1819 bei Minsk geboren.","I was born near Minsk in 1819."],["Ich schrieb die Oper „Straszny dwór“ (Das Gespensterschloss).","I wrote the opera 'Straszny dwór' (The Haunted Manor)."],["Meine Oper „Halka“ gilt als polnische Nationaloper.","My opera 'Halka' is seen as the Polish national opera."]]},{"name":"Juliusz Słowacki","clues":[["Ich wurde 1809 in Krzemieniec geboren und starb 1849 in Paris.","I was born in Krzemieniec in 1809 and died in Paris in 1849."],["Ich schrieb das Drama „Kordian“.","I wrote the drama 'Kordian'."],["Ich bin einer der drei polnischen Nationaldichter und ruhe auf dem Wawel.","I am one of Poland's three national bards and rest at Wawel."]]},{"name":"Bolesław Prus","clues":[["Ich wurde 1847 in Hrubieszów geboren.","I was born in Hrubieszów in 1847."],["Mein eigentlicher Name war Aleksander Głowacki.","My real name was Aleksander Głowacki."],["Ich schrieb die Romane „Lalka“ (Die Puppe) und „Faraon“.","I wrote the novels 'Lalka' (The Doll) and 'Faraon'."]]},{"name":"Władysław Reymont","clues":[["Ich wurde 1867 in Kobiele Wielkie geboren.","I was born in Kobiele Wielkie in 1867."],["Ich schrieb den Roman „Ziemia obiecana“ über Łódź.","I wrote the novel 'The Promised Land' about Łódź."],["Für „Chłopi“ (Die Bauern) bekam ich 1924 den Literaturnobelpreis.","I won the 1924 Nobel Prize in Literature for 'The Peasants'."]]},{"name":"Stanisław Wyspiański","clues":[["Ich wurde 1869 in Krakau geboren.","I was born in Kraków in 1869."],["Ich entwarf die Buntglasfenster der Franziskanerkirche in Krakau.","I designed the stained glass of Kraków's Franciscan church."],["Ich schrieb das Drama „Wesele“ (Die Hochzeit).","I wrote the drama 'Wesele' (The Wedding)."]]},{"name":"Witold Gombrowicz","clues":[["Ich wurde 1904 in Małoszyce geboren.","I was born in Małoszyce in 1904."],["1939 blieb ich in Argentinien und lebte dort über 20 Jahre.","In 1939 I stayed in Argentina and lived there for over 20 years."],["Ich schrieb den Roman „Ferdydurke“.","I wrote the novel 'Ferdydurke'."]]},{"name":"Bruno Schulz","clues":[["Ich wurde 1892 in Drohobycz geboren.","I was born in Drohobych in 1892."],["Ich war Schriftsteller, Zeichner und Kunstlehrer; 1942 wurde ich erschossen.","I was a writer, artist and art teacher; I was shot in 1942."],["Ich schrieb „Sklepy cynamonowe“ (Die Zimtläden).","I wrote 'The Cinnamon Shops'."]]},{"name":"Julian Tuwim","clues":[["Ich wurde 1894 in Łódź geboren.","I was born in Łódź in 1894."],["Ich gehörte zur Dichtergruppe „Skamander“.","I belonged to the 'Skamander' group of poets."],["Ich schrieb das Kindergedicht „Lokomotywa“.","I wrote the children's poem 'Lokomotywa' (The Locomotive)."]]},{"name":"Jan Brzechwa","clues":[["Ich wurde 1898 in Schytomyr geboren.","I was born in Zhytomyr in 1898."],["Ich war Anwalt und schrieb viele Kindergedichte, z. B. „Kaczka-dziwaczka“.","I was a lawyer and wrote many children's poems, e.g. 'Kaczka-dziwaczka'."],["Ich schrieb „Akademia pana Kleksa“.","I wrote 'Mr Blot's Academy'."]]},{"name":"Maria Konopnicka","clues":[["Ich wurde 1842 in Suwałki geboren.","I was born in Suwałki in 1842."],["Ich schrieb das Märchen von den Zwergen und der Waise Marysia.","I wrote the tale of the dwarfs and the orphan Marysia."],["Ich schrieb das patriotische Gedicht „Rota“.","I wrote the patriotic poem 'Rota'."]]},{"name":"Eliza Orzeszkowa","clues":[["Ich wurde 1841 bei Grodno geboren.","I was born near Grodno in 1841."],["Ich war eine Schriftstellerin des Positivismus und für den Nobelpreis nominiert.","I was a writer of Positivism and nominated for the Nobel Prize."],["Ich schrieb den Roman „Nad Niemnem“ (An der Memel).","I wrote the novel 'On the Niemen'."]]},{"name":"Jan Kochanowski","clues":[["Ich wurde 1530 in Sycyna geboren.","I was born in Sycyna in 1530."],["Ich gelte als größter Dichter der polnischen Renaissance.","I am seen as the greatest poet of the Polish Renaissance."],["Nach dem Tod meiner Tochter Urszula schrieb ich die „Treny“.","After my daughter Urszula died, I wrote the 'Laments'."]]},{"name":"Ryszard Kapuściński","clues":[["Ich wurde 1932 in Pińsk geboren.","I was born in Pinsk in 1932."],["Ich berichtete jahrzehntelang aus Afrika und Lateinamerika.","For decades I reported from Africa and Latin America."],["Ich schrieb die Reportage „König der Könige“ über Haile Selassie.","I wrote 'The Emperor' about Haile Selassie."]]},{"name":"Karol Szymanowski","clues":[["Ich wurde 1882 in Tymoszówka in der Ukraine geboren.","I was born in Tymoszówka, Ukraine, in 1882."],["Meine Villa „Atma“ in Zakopane ist heute ein Museum.","My villa 'Atma' in Zakopane is now a museum."],["Ich komponierte das Ballett „Harnasie“ nach Musik der Goralen.","I composed the ballet 'Harnasie' based on highlander music."]]},{"name":"Krzysztof Penderecki","clues":[["Ich wurde 1933 in Dębica geboren.","I was born in Dębica in 1933."],["Meine Musik erklingt in Kubricks Film „Shining“.","My music is heard in Kubrick's film 'The Shining'."],["Ich komponierte „Threnos – den Opfern von Hiroshima“.","I composed 'Threnody to the Victims of Hiroshima'."]]},{"name":"Henryk Wieniawski","clues":[["Ich wurde 1835 in Lublin geboren.","I was born in Lublin in 1835."],["Ich war ein Geigenvirtuose und spielte in ganz Europa und Amerika.","I was a violin virtuoso who played across Europe and America."],["Ein berühmter Geigenwettbewerb in Poznań trägt meinen Namen.","A famous violin competition in Poznań bears my name."]]},{"name":"Witold Lutosławski","clues":[["Ich wurde 1913 in Warschau geboren.","I was born in Warsaw in 1913."],["Im Krieg spielte ich mit Andrzej Panufnik Klavier in Warschauer Cafés.","During the war I played piano with Andrzej Panufnik in Warsaw cafés."],["Ich komponierte das „Konzert für Orchester“.","I composed the 'Concerto for Orchestra'."]]},{"name":"Wojciech Kilar","clues":[["Ich wurde 1932 in Lwów geboren.","I was born in Lwów in 1932."],["Ich schrieb die Musik zu Polańskis Film „Der Pianist“.","I wrote the score for Polański's 'The Pianist'."],["Ich komponierte die Filmmusik zu Coppolas „Dracula“.","I composed the score for Coppola's 'Dracula'."]]},{"name":"Czesław Niemen","clues":[["Ich wurde 1939 in Stare Wasiliszki geboren.","I was born in Stare Wasiliszki in 1939."],["Ich war ein Pionier des polnischen Rock und spielte gern die Hammondorgel.","I was a pioneer of Polish rock and loved the Hammond organ."],["Ich sang „Dziwny jest ten świat“ (Seltsam ist diese Welt).","I sang 'Dziwny jest ten świat' (Strange Is This World)."]]},{"name":"Anna German","clues":[["Ich wurde 1936 in Urgentsch in Usbekistan geboren.","I was born in Urgench, Uzbekistan, in 1936."],["Ich war in Polen und in der Sowjetunion eine große Sängerin.","I was a star singer in Poland and the Soviet Union."],["Mein Hit war „Tańczące Eurydyki“.","My hit was 'Tańczące Eurydyki'."]]},{"name":"Agnieszka Osiecka","clues":[["Ich wurde 1936 in Warschau geboren.","I was born in Warsaw in 1936."],["Ich schrieb Tausende Liedtexte und arbeitete für das Studentenkabarett STS.","I wrote thousands of lyrics and worked for the STS student cabaret."],["Ich schrieb die Texte zu „Małgośka“ und „Niech żyje bal“.","I wrote the lyrics of 'Małgośka' and 'Niech żyje bal'."]]},{"name":"Agnieszka Holland","clues":[["Ich wurde 1948 in Warschau geboren und studierte Film in Prag.","I was born in Warsaw in 1948 and studied film in Prague."],["Mein Film „Zielona granica“ (Green Border) lief 2023 in Venedig.","My film 'Green Border' premiered in Venice in 2023."],["Ich drehte „Hitlerjunge Salomon“ (Europa Europa).","I directed 'Europa Europa'."]]},{"name":"Paweł Pawlikowski","clues":[["Ich wurde 1957 in Warschau geboren und arbeitete lange in England.","I was born in Warsaw in 1957 and worked in England for years."],["Für „Cold War“ erhielt ich 2018 in Cannes den Regiepreis.","I won Best Director at Cannes in 2018 for 'Cold War'."],["Mein Film „Ida“ gewann 2015 den Oscar.","My film 'Ida' won the Oscar in 2015."]]},{"name":"Zbigniew Cybulski","clues":[["Ich wurde 1927 geboren und starb 1967 am Bahnhof in Wrocław.","I was born in 1927 and died at Wrocław station in 1967."],["Man nannte mich den „polnischen James Dean“.","I was called the 'Polish James Dean'."],["Ich spielte die Hauptrolle in Wajdas „Asche und Diamant“.","I starred in Wajda's 'Ashes and Diamonds'."]]},{"name":"Tamara Łempicka","clues":[["Ich starb 1980 in Cuernavaca in Mexiko.","I died in Cuernavaca, Mexico, in 1980."],["Ich war eine Malerin des Art déco in Paris.","I was an Art Deco painter in Paris."],["Mein Selbstporträt im grünen Bugatti ist weltbekannt.","My self-portrait in a green Bugatti is world-famous."]]},{"name":"Zdzisław Beksiński","clues":[["Ich wurde 1929 in Sanok geboren.","I was born in Sanok in 1929."],["Ich gab meinen Bildern absichtlich keine Titel.","I deliberately gave my paintings no titles."],["Ich malte düstere, albtraumhafte Landschaften.","I painted dark, nightmarish landscapes."]]},{"name":"Magdalena Abakanowicz","clues":[["Ich wurde 1930 in Falenty geboren.","I was born in Falenty in 1930."],["Ich wurde mit großen, raumfüllenden Textilskulpturen bekannt.","I became known for large, room-filling textile sculptures."],["Meine Installation „Agora“ mit 106 Figuren steht in Chicago.","My installation 'Agora' with 106 figures stands in Chicago."]]},{"name":"Stanisław Ignacy Witkiewicz","clues":[["Ich wurde 1885 in Warschau geboren.","I was born in Warsaw in 1885."],["Ich betrieb eine Porträtfirma mit strengen Regeln für Kunden.","I ran a portrait firm with strict rules for clients."],["Ich schrieb den Roman „Unersättlichkeit“ (Nienasycenie).","I wrote the novel 'Insatiability'."]]},{"name":"Marian Rejewski","clues":[["Ich wurde 1905 in Bydgoszcz geboren.","I was born in Bydgoszcz in 1905."],["Ich war Mathematiker beim polnischen Chiffrierbüro.","I was a mathematician at the Polish Cipher Bureau."],["Ende 1932 knackte ich die deutsche Enigma.","At the end of 1932 I broke the German Enigma."]]},{"name":"Stefan Banach","clues":[["Ich wurde 1892 in Krakau geboren.","I was born in Kraków in 1892."],["Mit Kollegen löste ich Aufgaben im „Schottischen Café“ in Lwów.","With colleagues I solved problems in the 'Scottish Café' in Lwów."],["Ich begründete die moderne Funktionalanalysis.","I founded modern functional analysis."]]},{"name":"Jan Heweliusz","clues":[["Ich wurde 1611 in Danzig geboren.","I was born in Gdańsk in 1611."],["Ich war Bierbrauer und Ratsherr meiner Stadt.","I was a brewer and city councillor."],["Ich war Astronom und zeichnete eine Mondkarte, die „Selenographia“.","I was an astronomer and mapped the Moon in 'Selenographia'."]]},{"name":"Ludwik Zamenhof","clues":[["Ich wurde 1859 in Białystok geboren.","I was born in Białystok in 1859."],["Ich war Augenarzt.","I was an eye doctor."],["1887 erfand ich die Sprache Esperanto.","In 1887 I created the Esperanto language."]]},{"name":"Józef Rotblat","clues":[["Ich wurde 1908 in Warschau geboren.","I was born in Warsaw in 1908."],["Ich verließ das Manhattan-Projekt aus Gewissensgründen.","I left the Manhattan Project for reasons of conscience."],["1995 bekam ich den Friedensnobelpreis gegen Atomwaffen.","In 1995 I won the Nobel Peace Prize for opposing nuclear weapons."]]},{"name":"Stanisław Ulam","clues":[["Ich wurde 1909 in Lwów geboren.","I was born in Lwów in 1909."],["Ich entwickelte die Monte-Carlo-Methode mit.","I co-developed the Monte Carlo method."],["Mit Edward Teller entwarf ich das Prinzip der Wasserstoffbombe.","With Edward Teller I designed the hydrogen bomb concept."]]},{"name":"Kazimierz Pułaski","clues":[["Ich wurde 1745 in Warschau geboren.","I was born in Warsaw in 1745."],["Ich starb 1779 nach der Schlacht um Savannah.","I died in 1779 after the Siege of Savannah."],["Man nennt mich „Vater der amerikanischen Kavallerie“.","I am called the 'father of the American cavalry'."]]},{"name":"Józef Poniatowski","clues":[["Ich wurde 1763 in Wien geboren.","I was born in Vienna in 1763."],["Napoleon machte mich 1813 zum Marschall von Frankreich.","Napoleon made me a Marshal of France in 1813."],["Ich ertrank nach der Völkerschlacht bei Leipzig in der Elster.","I drowned in the Elster after the Battle of Leipzig."]]},{"name":"Jan Henryk Dąbrowski","clues":[["Ich wurde 1755 in Pierzchów geboren.","I was born in Pierzchów in 1755."],["1797 gründete ich die Polnischen Legionen in Italien.","In 1797 I founded the Polish Legions in Italy."],["Die polnische Nationalhymne nennt meinen Namen.","The Polish national anthem mentions my name."]]},{"name":"Władysław Jagiełło","clues":[["Ich war Großfürst von Litauen.","I was Grand Duke of Lithuania."],["1386 heiratete ich Königin Jadwiga und wurde König von Polen.","In 1386 I married Queen Jadwiga and became King of Poland."],["1410 besiegte ich den Deutschen Orden bei Grunwald.","In 1410 I defeated the Teutonic Order at Grunwald."]]},{"name":"Jadwiga Andegaweńska","clues":[["Ich wurde 1384 als „König“ von Polen gekrönt.","In 1384 I was crowned 'king' of Poland."],["Ich vermachte meinen Schmuck der Krakauer Akademie.","I left my jewels to the Kraków Academy."],["Papst Johannes Paul II. sprach mich 1997 heilig.","Pope John Paul II canonised me in 1997."]]},{"name":"Stefan Batory","clues":[["Ich war Fürst von Siebenbürgen.","I was Prince of Transylvania."],["1576 wurde ich zum König von Polen gewählt.","In 1576 I was elected King of Poland."],["1579 gründete ich die Universität in Wilna.","In 1579 I founded the university in Vilnius."]]},{"name":"Zygmunt III Waza","clues":[["Ich stammte aus dem schwedischen Königshaus Wasa.","I came from the Swedish royal house of Vasa."],["Ich verlegte meinen Hof von Krakau nach Warschau.","I moved my court from Kraków to Warsaw."],["Meine Säule steht auf dem Schlossplatz in Warschau.","My column stands on Castle Square in Warsaw."]]},{"name":"Stanisław August Poniatowski","clues":[["Ich ließ den Łazienki-Park in Warschau ausbauen.","I had the Łazienki Park in Warsaw developed."],["1791 unterzeichnete ich die Verfassung vom 3. Mai.","In 1791 I signed the Constitution of 3 May."],["Ich war der letzte König Polens.","I was the last king of Poland."]]},{"name":"Emilia Plater","clues":[["Ich wurde 1806 in Wilna geboren.","I was born in Vilnius in 1806."],["Mickiewicz schrieb über meinen Tod ein Gedicht.","Mickiewicz wrote a poem about my death."],["Ich kämpfte als Frau im Novemberaufstand 1830/31.","As a woman I fought in the November Uprising of 1830–31."]]},{"name":"Władysław Sikorski","clues":[["Ich wurde 1881 in Tuszów Narodowy geboren.","I was born in Tuszów Narodowy in 1881."],["Ich war im Zweiten Weltkrieg Premier der Exilregierung.","In WWII I was prime minister of the government in exile."],["1943 starb ich bei einem Flugzeugabsturz vor Gibraltar.","In 1943 I died in a plane crash off Gibraltar."]]},{"name":"Maksymilian Kolbe","clues":[["Ich wurde 1894 in Zduńska Wola geboren.","I was born in Zduńska Wola in 1894."],["Ich gründete das Kloster Niepokalanów.","I founded the friary of Niepokalanów."],["In Auschwitz ging ich 1941 für einen Mithäftling in den Tod.","In Auschwitz in 1941 I died in place of another prisoner."]]},{"name":"Janusz Korczak","clues":[["Ich schrieb das Kinderbuch „König Hänschen I.“","I wrote the children's book 'King Matt the First'."],["Ich war Arzt und leitete ein Waisenhaus in Warschau.","I was a doctor and ran an orphanage in Warsaw."],["1942 ging ich mit meinen Waisenkindern nach Treblinka.","In 1942 I went to Treblinka with my orphans."]]},{"name":"Jan Karski","clues":[["Ich wurde 1914 in Łódź geboren.","I was born in Łódź in 1914."],["Ich war Kurier des polnischen Untergrundstaats.","I was a courier of the Polish Underground State."],["1943 berichtete ich Präsident Roosevelt vom Holocaust.","In 1943 I told President Roosevelt about the Holocaust."]]},{"name":"Krzysztof Kamil Baczyński","clues":[["Ich wurde 1921 in Warschau geboren.","I was born in Warsaw in 1921."],["Ich war ein Dichter der „Generation der Kolumbusse“.","I was a poet of the 'Columbus generation'."],["1944 fiel ich im Warschauer Aufstand.","In 1944 I was killed in the Warsaw Uprising."]]},{"name":"Faustyna Kowalska","clues":[["Ich wurde 1905 in Głogowiec geboren.","I was born in Głogowiec in 1905."],["Ich war Ordensschwester und schrieb ein geistliches Tagebuch.","I was a nun and kept a spiritual diary."],["Auf mich geht das Bild „Jesus, ich vertraue auf Dich“ zurück.","The image 'Jesus, I trust in You' goes back to me."]]},{"name":"Jerzy Popiełuszko","clues":[["Ich wurde 1947 in Okopy geboren.","I was born in Okopy in 1947."],["Ich war Priester und hielt Messen für das Vaterland.","I was a priest and held Masses for the Homeland."],["1984 wurde ich von der Geheimpolizei ermordet.","In 1984 I was murdered by the secret police."]]},{"name":"Stefan Wyszyński","clues":[["Ich wurde 1901 in Zuzela geboren.","I was born in Zuzela in 1901."],["Von 1953 bis 1956 war ich von den Kommunisten interniert.","From 1953 to 1956 I was interned by the communists."],["Man nennt mich den „Primas des Jahrtausends“.","I am called the 'Primate of the Millennium'."]]},{"name":"Anna Walentynowicz","clues":[["Ich wurde 1929 in Równe geboren.","I was born in Równe in 1929."],["Ich war Kranführerin auf der Danziger Werft.","I was a crane operator at the Gdańsk Shipyard."],["Meine Entlassung löste im August 1980 den großen Streik aus.","My dismissal sparked the great strike of August 1980."]]},{"name":"Tadeusz Mazowiecki","clues":[["Ich wurde 1927 in Płock geboren.","I was born in Płock in 1927."],["Ich war Berater der Solidarność und Journalist.","I was an adviser to Solidarity and a journalist."],["1989 wurde ich erster nichtkommunistischer Premier.","In 1989 I became the first non-communist prime minister."]]},{"name":"Irena Szewińska","clues":[["Ich wurde 1946 in Leningrad geboren.","I was born in Leningrad in 1946."],["Ich lief Sprint und sprang weit.","I was a sprinter and long jumper."],["Ich gewann sieben olympische Medaillen in der Leichtathletik.","I won seven Olympic medals in athletics."]]},{"name":"Kazimierz Deyna","clues":[["Ich wurde 1947 in Starogard Gdański geboren.","I was born in Starogard Gdański in 1947."],["Ich war lange Kapitän der Nationalelf und spielte für Legia.","I was national team captain for years and played for Legia."],["1972 gewann ich mit Polen Olympia-Gold im Fußball.","In 1972 I won Olympic football gold with Poland."]]},{"name":"Zbigniew Boniek","clues":[["Ich wurde 1956 in Bydgoszcz geboren.","I was born in Bydgoszcz in 1956."],["Bei der WM 1982 schoss ich drei Tore gegen Belgien.","At the 1982 World Cup I scored a hat-trick against Belgium."],["Ich spielte für Juventus Turin.","I played for Juventus."]]},{"name":"Kamil Stoch","clues":[["Ich wurde 1987 in Zakopane geboren.","I was born in Zakopane in 1987."],["Ich gewann alle vier Springen einer Vierschanzentournee.","I won all four events of a Four Hills Tournament."],["Ich bin Skispringer mit drei olympischen Goldmedaillen.","I am a ski jumper with three Olympic gold medals."]]},{"name":"Justyna Kowalczyk","clues":[["Ich wurde 1983 in Limanowa geboren.","I was born in Limanowa in 1983."],["Ich gewann viermal den Gesamtweltcup.","I won the overall World Cup four times."],["Ich bin Skilangläuferin und Olympiasiegerin 2010 und 2014.","I am a cross-country skier, Olympic champion in 2010 and 2014."]]},{"name":"Otylia Jędrzejczak","clues":[["Ich wurde 1983 in Ruda Śląska geboren.","I was born in Ruda Śląska in 1983."],["Ich versteigerte meine Goldmedaille für kranke Kinder.","I auctioned my gold medal for sick children."],["2004 wurde ich Olympiasiegerin über 200 m Schmetterling.","In 2004 I became Olympic champion in the 200 m butterfly."]]},{"name":"Robert Kubica","clues":[["Ich wurde 1984 in Krakau geboren.","I was born in Kraków in 1984."],["2008 gewann ich den Großen Preis von Kanada.","In 2008 I won the Canadian Grand Prix."],["Ich war der erste Pole in der Formel 1.","I was the first Pole in Formula One."]]},{"name":"Agnieszka Radwańska","clues":[["Ich wurde 1989 in Krakau geboren.","I was born in Kraków in 1989."],["2015 gewann ich die WTA Finals.","In 2015 I won the WTA Finals."],["2012 stand ich als Tennisspielerin im Wimbledon-Finale.","In 2012 I played in the Wimbledon final."]]},{"name":"Anita Włodarczyk","clues":[["Ich wurde 1985 in Rawicz geboren.","I was born in Rawicz in 1985."],["Ich warf als erste Frau den Hammer über 80 Meter.","I was the first woman to throw the hammer over 80 metres."],["Ich bin dreifache Olympiasiegerin im Hammerwurf.","I am a three-time Olympic hammer throw champion."]]},{"name":"Robert Korzeniowski","clues":[["Ich wurde 1968 in Lubaczów geboren.","I was born in Lubaczów in 1968."],["2000 in Sydney gewann ich zwei Goldmedaillen.","In Sydney in 2000 I won two gold medals."],["Ich bin Geher und viermaliger Olympiasieger.","I am a race walker and four-time Olympic champion."]]},{"name":"Halina Konopacka","clues":[["Ich wurde 1900 geboren und schrieb auch Gedichte.","I was born in 1900 and also wrote poetry."],["Ich warf den Diskus.","I threw the discus."],["1928 in Amsterdam holte ich das erste Olympia-Gold für Polen.","In Amsterdam in 1928 I won Poland's first Olympic gold."]]},{"name":"Helena Rubinstein","clues":[["Ich wurde 1872 in Krakau geboren.","I was born in Kraków in 1872."],["Meinen ersten Kosmetiksalon eröffnete ich in Australien.","I opened my first beauty salon in Australia."],["Ich gründete ein weltweites Kosmetikimperium.","I founded a worldwide cosmetics empire."]]},{"name":"Sławomir Mrożek","clues":[["Ich wurde 1930 in Borzęcin geboren.","I was born in Borzęcin in 1930."],["Ich zeichnete auch satirische Cartoons.","I also drew satirical cartoons."],["Ich schrieb das absurde Drama „Tango“.","I wrote the absurdist play 'Tango'."]]},{"name":"Andrzej Sapkowski","clues":[["Ich wurde 1948 in Łódź geboren.","I was born in Łódź in 1948."],["Nach meinen Büchern entstanden Videospiele und eine Netflix-Serie.","My books inspired video games and a Netflix series."],["Ich erfand den Hexer Geralt von Riva.","I created Geralt of Rivia, the Witcher."]]},{"name":"Helena Modrzejewska","clues":[["Ich wurde 1840 in Krakau geboren.","I was born in Kraków in 1840."],["Ab 1876 machte ich Karriere auf Bühnen in den USA.","From 1876 I built a stage career in the USA."],["Ich war eine große Shakespeare-Schauspielerin.","I was a great Shakespearean actress."]]},{"name":"Bronisław Malinowski","clues":[["Ich wurde 1884 in Krakau geboren.","I was born in Kraków in 1884."],["Ich lehrte an der London School of Economics.","I taught at the London School of Economics."],["Ich erforschte als Ethnologe die Trobriand-Inseln.","As an anthropologist I studied the Trobriand Islands."]]},{"name":"Jan Czochralski","clues":[["Ich wurde 1885 in Kcynia geboren.","I was born in Kcynia in 1885."],["Ich war Chemiker und arbeitete lange in Berlin.","I was a chemist and worked in Berlin for years."],["Mit meinem Verfahren züchtet man Siliziumkristalle für Chips.","My method is used to grow silicon crystals for chips."]]}],"tf":[[1,"Neben dem Geburtstag feiert man in Polen oft auch den Namenstag (imieniny).","Besides birthdays, Poles often celebrate their name day (imieniny).","Im Kalender steht zu jedem Tag, welche Namen gefeiert werden.","Calendars show which names are celebrated on each day."],[1,"An Heiligabend (Wigilia) kommen traditionell 12 Gerichte ohne Fleisch auf den Tisch.","On Christmas Eve (Wigilia) there are traditionally 12 meatless dishes.","Typisch sind Barszcz mit Uszka, Karpfen und Pierogi.","Typical are barszcz with uszka, carp and pierogi."],[1,"An Wigilia deckt man ein Gedeck mehr für einen unerwarteten Gast.","At Wigilia an extra place is set for an unexpected guest.","Es steht für Gastfreundschaft und für die, die nicht da sein können.","It stands for hospitality and for those who cannot be there."],[1,"Am Ostermontag (Śmigus-dyngus) bespritzt man sich gegenseitig mit Wasser.","On Easter Monday (Śmigus-dyngus) people splash each other with water.","Ein alter Brauch, vor allem bei Kindern beliebt.","An old custom, especially popular with children."],[1,"Am Fetten Donnerstag (Tłusty czwartek) isst man Pączki.","On Fat Thursday (Tłusty czwartek) people eat pączki.","Pączki sind Krapfen, oft mit Rosenmarmelade gefüllt.","Pączki are doughnuts, often filled with rose jam."],[0,"Blumen verschenkt man in Polen in gerader Anzahl.","In Poland you give flowers in an even number.","Falsch: Man schenkt eine ungerade Zahl. Gerade Zahlen sind für Beerdigungen.","False: you give an odd number. Even numbers are for funerals."],[0,"Polens Unabhängigkeitstag ist der 3. Oktober.","Poland's Independence Day is 3 October.","Falsch: Es ist der 11. November (1918). Am 3. Mai feiert man die Verfassung von 1791.","False: it is 11 November (1918). On 3 May Poles celebrate the 1791 Constitution."],[1,"Zu Hause zieht man meist die Schuhe aus und bekommt Hausschuhe (kapcie).","At home people usually take off their shoes and get slippers (kapcie).","Gäste bekommen oft eigene Hausschuhe angeboten.","Guests are often offered slippers too."],[0,"In Polen zahlt man mit dem Euro.","Poland uses the euro.","Falsch: Polen ist in der EU, behält aber den Złoty.","False: Poland is in the EU but keeps the złoty."],[1,"Zum Geburtstag singt man „Sto lat“ und wünscht damit 100 Jahre.","On birthdays people sing 'Sto lat', wishing someone 100 years.","„Sto lat“ heißt wörtlich „hundert Jahre“.","'Sto lat' literally means 'a hundred years'."],[0,"Der höchste Berg Polens ist die Schneekoppe (Śnieżka).","Poland's highest mountain is Śnieżka.","Falsch: Es ist Rysy in der Tatra mit 2.499 m. Die Śnieżka hat 1.603 m.","False: it is Rysy in the Tatras at 2,499 m. Śnieżka is 1,603 m."],[1,"Die Weichsel (Wisła) fließt durch Krakau und Warschau in die Ostsee.","The Vistula (Wisła) flows through Kraków and Warsaw into the Baltic.","Sie mündet bei Danzig.","It reaches the sea near Gdańsk."],[1,"Zapiekanka ist ein überbackenes Baguette mit Pilzen und Käse.","Zapiekanka is a toasted baguette with mushrooms and cheese.","Ein Imbissklassiker, berühmt am Plac Nowy in Krakau.","A street-food classic, famous at Plac Nowy in Kraków."],[1,"An Allerheiligen (1. November) leuchten die Friedhöfe voller Kerzen.","On All Saints' Day (1 November) cemeteries glow with candles.","Familien besuchen die Gräber ihrer Angehörigen, oft weit gereist.","Families visit their relatives' graves, often travelling far."],[0,"Fremde duzt man in Polen sofort.","In Poland you immediately use the informal 'you' with strangers.","Falsch: Man sagt pan/pani, bis man das Du anbietet.","False: you say pan/pani until the informal 'you' is offered."],[0,"Polen ist flächenmäßig größer als Deutschland.","Poland is larger in area than Germany.","Falsch, aber knapp: Polen ca. 313.000 km², Deutschland ca. 357.000 km².","False, but close: Poland about 313,000 km², Germany about 357,000 km²."],[1,"Krakau war bis um 1600 die Hauptstadt Polens.","Kraków was Poland's capital until around 1600.","Der Hof zog Ende des 16. Jahrhunderts nach Warschau.","The royal court moved to Warsaw at the end of the 16th century."],[1,"Auf der Halbinsel Hel gibt es eine Station für Ostsee-Robben.","On the Hel Peninsula there is a station for Baltic seals.","Das Fokarium in Hel wird von der Universität Danzig betrieben.","The Hel seal sanctuary is run by the University of Gdańsk."],[1,"Die Warschauer Altstadt wurde nach dem Zweiten Weltkrieg wieder aufgebaut und ist UNESCO-Welterbe.","Warsaw's Old Town was rebuilt after World War II and is a UNESCO World Heritage Site.","Sie war fast völlig zerstört; man baute sie u. a. nach alten Gemälden wieder auf.","It was almost completely destroyed and rebuilt partly from old paintings."],[1,"Polen grenzt an sieben Länder.","Poland borders seven countries.","Deutschland, Tschechien, Slowakei, Ukraine, Belarus, Litauen und Russland (Kaliningrad).","Germany, Czechia, Slovakia, Ukraine, Belarus, Lithuania and Russia (Kaliningrad)."],[1,"Die polnische Flagge ist oben weiß und unten rot.","The Polish flag is white on top and red below.","Weiß und Rot stammen aus dem Wappen: weißer Adler auf rotem Grund.","White and red come from the coat of arms: a white eagle on a red field."],[1,"Das Wappentier Polens ist ein weißer Adler.","Poland's heraldic animal is a white eagle.","Der Legende nach sah Lech, der Gründer, einen weißen Adler im Nest bei Gniezno.","Legend says Lech, the founder, saw a white eagle in its nest near Gniezno."],[1,"Die Nationalhymne heißt „Mazurek Dąbrowskiego“.","The national anthem is called 'Mazurek Dąbrowskiego'.","Sie beginnt mit „Jeszcze Polska nie zginęła“ – Noch ist Polen nicht verloren.","It begins 'Jeszcze Polska nie zginęła' – Poland has not yet perished."],[1,"Am 3. Mai feiert Polen den Tag der Verfassung.","On 3 May Poland celebrates Constitution Day.","Die Verfassung vom 3. Mai 1791 war die erste moderne Verfassung Europas.","The Constitution of 3 May 1791 was Europe's first modern constitution."],[1,"In Polen bezahlt man mit dem Złoty.","In Poland you pay with the złoty.","Złoty heißt „golden“; 1 Złoty hat 100 Groszy.","Złoty means 'golden'; 1 złoty has 100 groszy."],[1,"Żurek ist eine saure Roggensuppe, oft im ausgehöhlten Brot serviert.","Żurek is a sour rye soup, often served in a hollowed-out loaf.","Typisch zu Ostern, mit Wurst und Ei.","Typical at Easter, with sausage and egg."],[1,"Bigos ist ein Eintopf aus Sauerkraut und Fleisch.","Bigos is a stew of sauerkraut and meat.","Man nennt ihn auch „Jägereintopf“; aufgewärmt schmeckt er am besten.","It's also called 'hunter's stew'; it tastes best reheated."],[1,"Oscypek ist ein geräucherter Schafskäse aus der Tatra.","Oscypek is a smoked sheep's cheese from the Tatras.","Er hat eine typische Spindelform mit Mustern und ist EU-geschützt.","It has a typical spindle shape with patterns and is EU-protected."],[1,"Im Salzbergwerk Wieliczka gibt es eine Kapelle, die ganz aus Salz gehauen ist.","In the Wieliczka salt mine there is a chapel carved entirely out of salt.","Die Kinga-Kapelle liegt über 100 m unter der Erde – sogar die Kronleuchter sind aus Salz.","St Kinga's Chapel lies over 100 m underground – even the chandeliers are made of salt."],[1,"Die Marienburg (Malbork) gilt als größte Backsteinburg der Welt.","Malbork Castle is considered the largest brick castle in the world.","Sie wurde vom Deutschen Orden gebaut und ist UNESCO-Welterbe.","It was built by the Teutonic Order and is a UNESCO World Heritage Site."],[1,"Im Białowieża-Urwald leben frei lebende Wisente (żubry).","Wild European bison (żubry) live in the Białowieża Forest.","Der Wisent war fast ausgestorben und wurde hier wieder angesiedelt.","The bison was almost extinct and was reintroduced here."],[1,"In Krakau spielt ein Trompeter jede Stunde den Hejnał vom Turm der Marienkirche.","In Kraków a trumpeter plays the Hejnał from St Mary's tower every hour.","Die Melodie bricht mitten im Ton ab – zur Erinnerung an einen Wächter, den ein Pfeil traf.","The tune breaks off mid-note – in memory of a watchman hit by an arrow."],[1,"Toruń ist für seine Lebkuchen (pierniki) berühmt.","Toruń is famous for its gingerbread (pierniki).","Es gibt dort sogar ein Lebkuchen-Museum.","There is even a gingerbread museum there."],[1,"Nikolaus Kopernikus wurde in Toruń geboren.","Nicolaus Copernicus was born in Toruń.","1473 – sein Geburtshaus ist heute ein Museum.","In 1473 – his birthplace is a museum today."],[1,"Chopins Herz ist in einer Kirche in Warschau eingemauert.","Chopin's heart is sealed in a pillar of a Warsaw church.","Er starb 1849 in Paris; seine Schwester brachte das Herz in die Heilig-Kreuz-Kirche.","He died in Paris in 1849; his sister brought the heart to the Holy Cross Church."],[1,"In Breslau (Wrocław) verstecken sich Hunderte kleine Zwerge aus Bronze.","Hundreds of little bronze dwarfs are hidden around Wrocław.","Sie erinnern an die „Orangene Alternative“, die mit Zwergen gegen den Kommunismus protestierte.","They recall the 'Orange Alternative', which protested against communism with dwarfs."],[1,"Masuren nennt man das „Land der tausend Seen“.","Masuria is called the 'land of a thousand lakes'.","Tatsächlich sind es noch viel mehr – mit Kanälen dazwischen.","In fact there are many more – with canals in between."],[1,"Am Abend der Andrzejki (29. November) gießt man Wachs, um die Zukunft zu deuten.","On Andrzejki evening (29 November) people pour wax to tell the future.","Man gießt heißes Wachs durch ein Schlüsselloch in kaltes Wasser und deutet den Schatten.","Hot wax is poured through a keyhole into cold water and its shadow is interpreted."],[1,"Am Karsamstag bringt man ein Körbchen mit Essen zur Segnung in die Kirche (święconka).","On Holy Saturday people take a basket of food to church to be blessed (święconka).","Darin: Eier, Brot, Salz, Wurst und oft ein Lamm aus Zucker.","Inside: eggs, bread, salt, sausage and often a sugar lamb."],[1,"Beim Anstoßen sagt man „Na zdrowie!“.","When toasting you say 'Na zdrowie!'.","Wörtlich: „Auf die Gesundheit!“","Literally: 'To health!'"],[1,"Maria Skłodowska-Curie war die erste Frau, die einen Nobelpreis bekam.","Maria Skłodowska-Curie was the first woman to win a Nobel Prize.","1903 in Physik – 1911 folgte der Chemie-Nobelpreis.","In physics in 1903 – followed by chemistry in 1911."],[1,"Das polnische Alphabet hat 32 Buchstaben.","The Polish alphabet has 32 letters.","Mit ą, ć, ę, ł, ń, ó, ś, ź, ż – dafür ohne q, v und x.","With ą, ć, ę, ł, ń, ó, ś, ź, ż – but without q, v and x."],[1,"Die Gewerkschaft Solidarność entstand 1980 auf der Danziger Werft.","The Solidarity trade union was born in 1980 at the Gdańsk shipyard.","Ihr Anführer war der Elektriker Lech Wałęsa.","Its leader was the electrician Lech Wałęsa."],[1,"Der Zweite Weltkrieg begann am 1. September 1939 mit Schüssen auf die Westerplatte.","World War II began on 1 September 1939 with shots fired at the Westerplatte.","Das Schiff „Schleswig-Holstein“ beschoss das polnische Munitionsdepot bei Danzig.","The battleship 'Schleswig-Holstein' shelled the Polish depot near Gdańsk."],[1,"Zakopane nennt man die „Winterhauptstadt“ Polens.","Zakopane is called Poland's 'winter capital'.","Es liegt am Fuß der Tatra und ist das bekannteste Skigebiet.","It lies at the foot of the Tatras and is the best-known ski resort."],[1,"Polen ist der größte Apfelproduzent der EU.","Poland is the largest apple producer in the EU.","Ein Slogan lautete sogar: „Jedz jabłka“ – Iss Äpfel!","There was even a slogan: 'Jedz jabłka' – eat apples!"],[1,"Pączki sind traditionell mit Rosenmarmelade gefüllt.","Pączki are traditionally filled with rose jam.","Heute gibt es auch Pudding, Schokolade oder Pflaume.","Today there's also custard, chocolate or plum."],[1,"Das Wort „wódka“ ist eine Verkleinerung von „woda“ (Wasser).","The word 'wódka' is a diminutive of 'woda' (water).","Also etwa „Wässerchen“.","So roughly 'little water'."],[1,"Łódź ist für ihre berühmte Filmhochschule bekannt.","Łódź is known for its famous film school.","Dort studierten u. a. Andrzej Wajda und Krzysztof Kieślowski.","Andrzej Wajda and Krzysztof Kieślowski studied there, among others."],[1,"An Heiligabend wartet man mit dem Essen, bis der erste Stern am Himmel steht.","On Christmas Eve people wait to eat until the first star appears in the sky.","Kinder halten Ausschau nach der „pierwsza gwiazdka“.","Children look out for the 'pierwsza gwiazdka'."],[1,"An Heiligabend teilt man eine dünne Oblate (opłatek) und wünscht sich alles Gute.","On Christmas Eve people share a thin wafer (opłatek) and exchange good wishes.","Jeder bricht ein Stück von der Oblate des anderen ab.","Everyone breaks off a piece of the other person's wafer."],[1,"Karpfen ist ein traditionelles Gericht an Heiligabend.","Carp is a traditional Christmas Eve dish.","Früher schwamm er vorher oft ein paar Tage in der Badewanne.","It used to swim in the bathtub for a few days beforehand."],[1,"Papst Johannes Paul II. stammte aus Wadowice.","Pope John Paul II came from Wadowice.","Dort gibt es die berühmte „Papst-Cremeschnitte“ (kremówka).","The famous 'papal cream cake' (kremówka) comes from there."],[1,"Das Polnische hat sieben Fälle.","Polish has seven grammatical cases.","Nominativ, Genitiv, Dativ, Akkusativ, Instrumental, Lokativ und Vokativ.","Nominative, genitive, dative, accusative, instrumental, locative and vocative."],[1,"Polonaise und Mazurka sind polnische Tänze.","The polonaise and the mazurka are Polish dances.","Chopin schrieb Dutzende davon für Klavier.","Chopin wrote dozens of them for piano."],[1,"Beim Abiball (studniówka) 100 Tage vor dem Abitur tanzt man zuerst die Polonaise.","At the studniówka ball, 100 days before the final exams, the polonaise is danced first.","Studniówka kommt von „sto dni“ – hundert Tage.","Studniówka comes from 'sto dni' – a hundred days."],[1,"Śniardwy in Masuren ist der größte See Polens.","Śniardwy in Masuria is the largest lake in Poland.","Er ist rund 113 km² groß.","It covers about 113 km²."],[1,"Die Tuchhallen (Sukiennice) stehen mitten auf dem Krakauer Hauptmarkt.","The Cloth Hall (Sukiennice) stands in the middle of Kraków's Main Square.","Früher handelte man hier mit Stoffen, heute mit Souvenirs.","Cloth was traded here in the past; today it's souvenirs."],[1,"Das Wahrzeichen Warschaus ist eine Meerjungfrau (Syrenka) mit Schwert und Schild.","Warsaw's emblem is a mermaid (Syrenka) with a sword and shield.","Sie soll die Stadt beschützen.","She is said to protect the city."],[1,"Am Fuß des Wawel steht ein Drache aus Metall, der Feuer speit.","At the foot of Wawel Hill stands a metal dragon that breathes fire.","Er erinnert an die Legende vom Wawel-Drachen (Smok Wawelski).","It recalls the legend of the Wawel Dragon (Smok Wawelski)."],[1,"Johannes Paul II. war der erste polnische Papst.","John Paul II was the first Polish pope.","Karol Wojtyła wurde 1978 gewählt.","Karol Wojtyła was elected in 1978."],[1,"Stanisław Lem schrieb den Roman „Solaris“.","Stanisław Lem wrote the novel 'Solaris'.","Er ist einer der meistübersetzten Science-Fiction-Autoren.","He is one of the most translated science fiction authors."],[1,"Henryk Sienkiewicz schrieb „Quo vadis“.","Henryk Sienkiewicz wrote 'Quo Vadis'.","1905 bekam er den Literaturnobelpreis.","He won the Nobel Prize in Literature in 1905."],[1,"Polnisch ist wie Tschechisch und Slowakisch eine westslawische Sprache.","Like Czech and Slovak, Polish is a West Slavic language.","Deshalb verstehen sich Polen und Tschechen teilweise.","That's why Poles and Czechs partly understand each other."],[1,"Im Polnischen liegt die Betonung fast immer auf der vorletzten Silbe.","In Polish the stress is almost always on the second-to-last syllable.","Wie in Wa-RSZA-wa oder dzię-KU-ję.","As in Wa-RSZA-wa or dzię-KU-ję."],[1,"Oder und Neiße bilden die Grenze zwischen Polen und Deutschland.","The Oder and Neisse rivers form the border between Poland and Germany.","Man spricht von der Oder-Neiße-Grenze.","It's called the Oder–Neisse line."],[1,"Eine „bar mleczny“ (Milchbar) ist eine einfache, günstige Kantine.","A 'bar mleczny' (milk bar) is a simple, cheap canteen.","Dort gibt es Pierogi, Suppen und Pfannkuchen zu kleinen Preisen.","They serve pierogi, soups and pancakes at low prices."],[1,"Smalec ist Schweineschmalz, das man aufs Brot streicht.","Smalec is pork lard spread on bread.","Oft mit Zwiebeln und Grieben, dazu saure Gurken.","Often with onions and cracklings, served with pickles."],[1,"Der Name „Polska“ geht auf den Stamm der Polanen zurück.","The name 'Polska' goes back to the Polans tribe.","„Pole“ heißt Feld – die Polanen waren das „Feldvolk“.","'Pole' means field – the Polans were the 'people of the fields'."],[1,"Bolesław Chrobry wurde 1025 der erste gekrönte König Polens.","Bolesław Chrobry became the first crowned king of Poland in 1025.","Er war der Sohn von Mieszko I.","He was the son of Mieszko I."],[1,"Lech Wałęsa arbeitete als Elektriker auf der Danziger Werft.","Lech Wałęsa worked as an electrician at the Gdańsk shipyard.","Später bekam er den Friedensnobelpreis und wurde Präsident.","He later won the Nobel Peace Prize and became president."],[1,"Am 6. Dezember (Mikołajki) bekommen Kinder kleine Geschenke.","On 6 December (Mikołajki) children get small presents.","Oft liegen sie unter dem Kopfkissen oder im Schuh.","They're often under the pillow or in a shoe."],[1,"In Posen stoßen jeden Mittag zwei mechanische Ziegenböcke am Rathaus zusammen.","In Poznań two mechanical billy goats butt heads on the town hall every day at noon.","Die Koziołki sind das Wahrzeichen der Stadt.","The koziołki are the city's symbol."],[1,"Am 11. November isst man in Posen Martinshörnchen (rogale świętomarcińskie).","On 11 November people in Poznań eat St Martin's croissants (rogale świętomarcińskie).","Sie sind mit weißem Mohn und Nüssen gefüllt.","They're filled with white poppy seeds and nuts."],[1,"Die Weichsel ist der längste Fluss Polens.","The Vistula is the longest river in Poland.","Sie ist rund 1047 km lang.","It's about 1,047 km long."],[1,"Polen hat eine Küste an der Ostsee.","Poland has a coastline on the Baltic Sea.","Rund 500 km mit breiten Sandstränden und Dünen.","Around 500 km with wide sandy beaches and dunes."],[1,"Die Jahrhunderthalle in Breslau gehört zum UNESCO-Welterbe.","Wrocław's Centennial Hall is a UNESCO World Heritage Site.","Sie wurde 1913 gebaut und war damals ein Rekordbau aus Stahlbeton.","It was built in 1913 and was a record-breaking reinforced concrete building."],[1,"Kasza (Grütze) ist eine traditionelle Beilage in Polen.","Kasza (groats) is a traditional side dish in Poland.","Besonders beliebt ist Buchweizen (kasza gryczana).","Buckwheat (kasza gryczana) is especially popular."],[1,"Der Krakauer Hauptmarkt ist einer der größten mittelalterlichen Plätze Europas.","Kraków's Main Square is one of the largest medieval squares in Europe.","Er misst rund 200 × 200 Meter.","It measures about 200 × 200 metres."],[1,"Polens Notrufnummer 112 gilt wie in ganz Europa.","Poland's emergency number 112 works as everywhere in Europe.","Dazu gibt es noch alte Nummern wie 999 (Rettung) und 997 (Polizei).","There are also older numbers like 999 (ambulance) and 997 (police)."],[0,"Der längste Fluss Polens ist die Oder.","The longest river in Poland is the Oder.","Falsch: Es ist die Weichsel (rund 1047 km).","False: it's the Vistula (about 1,047 km)."],[0,"Die polnische Flagge ist oben rot und unten weiß.","The Polish flag is red on top and white below.","Falsch: oben Weiß, unten Rot. Rot-Weiß ist die Flagge Indonesiens bzw. Monacos.","False: white on top, red below. Red over white is Indonesia's or Monaco's flag."],[0,"Polen ist 1995 der EU beigetreten.","Poland joined the EU in 1995.","Falsch: Polen ist seit 2004 in der EU.","False: Poland has been in the EU since 2004."],[0,"Polen grenzt an Österreich.","Poland borders Austria.","Falsch: Dazwischen liegen Tschechien und die Slowakei.","False: Czechia and Slovakia lie in between."],[0,"Chopin wurde in Paris geboren.","Chopin was born in Paris.","Falsch: Er wurde 1810 in Żelazowa Wola bei Warschau geboren und starb in Paris.","False: he was born in Żelazowa Wola near Warsaw in 1810 and died in Paris."],[0,"Polnisch schreibt man mit kyrillischen Buchstaben.","Polish is written in the Cyrillic alphabet.","Falsch: Polnisch nutzt das lateinische Alphabet mit Zusatzzeichen wie ą, ł, ż.","False: Polish uses the Latin alphabet with extra letters like ą, ł, ż."],[0,"Pierogi sind eine Art Kuchen.","Pierogi are a kind of cake.","Falsch: Es sind gefüllte Teigtaschen, z. B. mit Kartoffel und Quark (ruskie).","False: they're filled dumplings, e.g. with potato and curd cheese (ruskie)."],[0,"Wigilia wird am 25. Dezember gefeiert.","Wigilia is celebrated on 25 December.","Falsch: Wigilia ist der Heiligabend, also der 24. Dezember.","False: Wigilia is Christmas Eve, 24 December."],[0,"Polen hat eine Küste an der Nordsee.","Poland has a coastline on the North Sea.","Falsch: Polen liegt an der Ostsee.","False: Poland lies on the Baltic Sea."],[0,"Maria Skłodowska-Curie bekam nur einen Nobelpreis.","Maria Skłodowska-Curie won only one Nobel Prize.","Falsch: Sie bekam zwei – Physik (1903) und Chemie (1911).","False: she won two – physics (1903) and chemistry (1911)."],[0,"Im Polnischen betont man immer die erste Silbe.","In Polish the first syllable is always stressed.","Falsch: Betont wird die vorletzte Silbe. Die erste Silbe betont man im Tschechischen.","False: the second-to-last syllable is stressed. Czech stresses the first."],[0,"Oscypek ist ein frischer, ungeräucherter Käse.","Oscypek is a fresh, unsmoked cheese.","Falsch: Oscypek wird geräuchert und ist deshalb außen goldbraun.","False: oscypek is smoked, which makes its rind golden brown."],[0,"Wisente sind in Polen ausgestorben.","European bison are extinct in Poland.","Falsch: Im Białowieża-Urwald leben wieder Hunderte frei.","False: hundreds live in the wild again in the Białowieża Forest."],[0,"Das Polnische hat nur drei Fälle.","Polish has only three grammatical cases.","Falsch: Es sind sieben.","False: there are seven."],[0,"Die Marienburg (Malbork) bauten polnische Könige.","Malbork Castle was built by Polish kings.","Falsch: Der Deutsche Orden baute sie als Hauptsitz.","False: the Teutonic Order built it as its headquarters."],[0,"Solidarność wurde in Krakau gegründet.","Solidarity was founded in Kraków.","Falsch: Sie entstand 1980 auf der Danziger Werft.","False: it was born in 1980 at the Gdańsk shipyard."],[0,"Der Krakauer Hejnał wird auf der Geige gespielt.","Kraków's Hejnał is played on the violin.","Falsch: Er wird auf der Trompete gespielt.","False: it's played on the trumpet."],[0,"Zakopane liegt an der Ostsee.","Zakopane lies on the Baltic Sea.","Falsch: Zakopane liegt im Süden am Fuß der Tatra.","False: Zakopane lies in the south at the foot of the Tatras."],[0,"Die Breslauer Zwerge sind aus Holz geschnitzt.","Wrocław's dwarfs are carved from wood.","Falsch: Sie sind aus Bronze gegossen.","False: they're cast in bronze."],[0,"Polnisch ist eng mit dem Ungarischen verwandt.","Polish is closely related to Hungarian.","Falsch: Ungarisch ist keine slawische Sprache, nicht einmal indogermanisch.","False: Hungarian isn't Slavic, nor even Indo-European."],[0,"Der Warschauer Aufstand fand 1968 statt.","The Warsaw Uprising took place in 1968.","Falsch: Er begann am 1. August 1944 und dauerte 63 Tage.","False: it began on 1 August 1944 and lasted 63 days."],[0,"Krakau wurde im Zweiten Weltkrieg genauso zerstört wie Warschau.","Kraków was destroyed in World War II just like Warsaw.","Falsch: Krakaus Altstadt blieb weitgehend erhalten.","False: Kraków's Old Town survived largely intact."],[0,"Toruń ist vor allem für Marzipan berühmt.","Toruń is famous above all for marzipan.","Falsch: Toruń ist für Lebkuchen berühmt; Marzipan ist eher Lübeck.","False: Toruń is famous for gingerbread; marzipan is more Lübeck."],[0,"Bigos ist eine süße Nachspeise.","Bigos is a sweet dessert.","Falsch: Bigos ist ein deftiger Eintopf aus Sauerkraut und Fleisch.","False: bigos is a hearty stew of sauerkraut and meat."],[0,"In Polen fand noch nie eine Fußball-EM statt.","Poland has never hosted a European Football Championship.","Falsch: 2012 war Polen gemeinsam mit der Ukraine Gastgeber.","False: Poland co-hosted it with Ukraine in 2012."],[0,"Die Weichsel mündet ins Schwarze Meer.","The Vistula flows into the Black Sea.","Falsch: Sie mündet bei Danzig in die Ostsee.","False: it flows into the Baltic near Gdańsk."],[0,"Bei der höflichen Anrede benutzt man im Polnischen wie im Deutschen die 3. Person Plural.","Polite address in Polish uses the 3rd person plural, like German 'Sie'.","Falsch: Man sagt Pan/Pani mit der 3. Person Singular: „Czy pan ma czas?“","False: you say Pan/Pani with the 3rd person singular: 'Czy pan ma czas?'"],[0,"Die Warschauer Altstadt ist komplett im Original aus dem Mittelalter erhalten.","Warsaw's Old Town has survived entirely in its medieval original.","Falsch: Sie wurde 1944 zerstört und nach dem Krieg wieder aufgebaut.","False: it was destroyed in 1944 and rebuilt after the war."],[0,"Stettin (Szczecin) liegt an der Weichsel.","Szczecin lies on the Vistula.","Falsch: Stettin liegt an der Oder.","False: Szczecin lies on the Oder."],[0,"Kopernikus stammte aus Krakau.","Copernicus came from Kraków.","Falsch: Er wurde in Toruń geboren und studierte in Krakau.","False: he was born in Toruń and studied in Kraków."]],"timeline":[[966,"Taufe Mieszkos I.: Beginn des christlichen Polen","Baptism of Mieszko I: start of Christian Poland"],[1000,"Akt von Gnesen: Otto III. besucht Bolesław Chrobry","Congress of Gniezno: Otto III visits Bolesław Chrobry"],[1025,"Bolesław Chrobry wird erster König Polens","Bolesław Chrobry becomes Poland's first king"],[1079,"Bischof Stanislaus wird auf Befehl des Königs getötet","Bishop Stanislaus is killed on the king's orders"],[1138,"Testament Bolesławs III.: Polen zerfällt in Teilfürstentümer","Testament of Bolesław III: Poland splits into duchies"],[1226,"Konrad von Masowien ruft den Deutschen Orden ins Land","Konrad of Masovia invites the Teutonic Order"],[1241,"Mongolensturm: Schlacht bei Liegnitz (Legnica)","Mongol invasion: Battle of Legnica"],[1320,"Krönung Władysław Łokieteks in Krakau","Coronation of Władysław the Short in Kraków"],[1333,"Kazimierz der Große wird König","Casimir the Great becomes king"],[1364,"Gründung der Krakauer Akademie (heute Jagiellonen-Universität)","Kraków Academy founded (today Jagiellonian University)"],[1370,"Tod Kazimierz' des Großen, Ende der Piasten auf dem Thron","Death of Casimir the Great, end of Piast kings"],[1385,"Union von Krewo: Polen und Litauen verbunden","Union of Krewo: Poland and Lithuania joined"],[1386,"Jagiełło heiratet Jadwiga und wird König","Jagiełło marries Jadwiga and becomes king"],[1410,"Schlacht bei Grunwald (Tannenberg)","Battle of Grunwald"],[1454,"Beginn des Dreizehnjährigen Krieges gegen den Orden","Thirteen Years' War against the Order begins"],[1466,"Zweiter Thorner Frieden: Polen gewinnt Danzig","Second Peace of Thorn: Poland gains Gdańsk"],[1473,"Nikolaus Kopernikus wird in Thorn geboren","Nicolaus Copernicus is born in Toruń"],[1505,"Verfassung Nihil novi stärkt den Sejm","Nihil novi constitution strengthens the Sejm"],[1525,"Preußische Huldigung in Krakau","Prussian Homage in Kraków"],[1543,"Kopernikus' Hauptwerk erscheint","Copernicus publishes his main work"],[1569,"Lubliner Union mit Litauen","Union of Lublin with Lithuania"],[1573,"Warschauer Konföderation sichert Religionsfreiheit","Warsaw Confederation guarantees religious freedom"],[1596,"Sigismund III. verlegt den Hof nach Warschau","Sigismund III moves the court to Warsaw"],[1610,"Sieg bei Kluschino, Polen besetzen Moskau","Victory at Klushino, Poles occupy Moscow"],[1621,"Schlacht bei Chocim gegen die Osmanen","Battle of Khotyn
