# Polski Szlak — nginx-Config IM Container (aus GeoQuest deploy/nginx-container.conf übernommen).
# Nur Port 80, kein TLS — HTTPS macht der Coolify-Proxy (Traefik).
map $uri $ps_cache {
    default                  "public, max-age=3600";
    ~*\.svg$                 "public, max-age=2592000";
    ~*\.woff2$               "public, max-age=31536000, immutable";
    ~*/audio/.+\.mp3$        "public, max-age=31536000, immutable";
    ~*/audio/voices\.json$   "no-cache";
    ~*/sw\.js$               "no-cache, no-store, must-revalidate";
    ~*/index\.html$          "no-cache";
    ~*/manifest\.json$       "no-cache";
    "/"                      "no-cache";
    ~*\.html$              "no-cache";
    ~*/data-[a-z0-9]+\.json$   "no-cache";
}
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    # Mikrofon für Sprechübungen erlauben (self), Kamera/Ort nicht
    add_header X-Content-Type-Options    "nosniff"                                         always;
    add_header X-Frame-Options           "DENY"                                            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                 always;
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()"    always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"             always;
    add_header Cache-Control             $ps_cache                                         always;
    gzip on; gzip_comp_level 6; gzip_min_length 1024; gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    location /audio/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
